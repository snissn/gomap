name: 5342 private metadata controls (not M0)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Execute controls and retain all outputs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/5342-evidence"
          mkdir -p "$evidence/tmp"
          export TMPDIR="$evidence/tmp"
          printf 'kind=5342-cache-metadata-controls-not-m0\ncontroller=%s\nworkflow=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence/identity.txt"
          git rev-parse HEAD >> "$evidence/identity.txt"
          git rev-parse d7db5409e20412f4dac4e1a3f902484b05e014e1^{tree} >> "$evidence/identity.txt"
          git status --porcelain --untracked-files=all > "$evidence/status.txt"
          cp -R .github/5342 "$evidence/sources"
          cp .github/workflows/treedb-vacuum-m0-observation.yml "$evidence/carrier-workflow.yml"
          sha256sum .github/5342/control-* .github/5342/candidate/scripts/observe_read_snapshot_cache.sh .github/5342/candidate/.github/workflows/read-snapshot-guardrails.yml .github/workflows/treedb-vacuum-m0-observation.yml > "$evidence/source-hashes.txt"
          git --version > "$evidence/tools.txt"
          bash --version >> "$evidence/tools.txt"
          python3 --version >> "$evidence/tools.txt"
          timeout --version >> "$evidence/tools.txt"
          stat --version >> "$evidence/tools.txt"
          result=0
          for name in control-symlinks.sh control-stat-failure.sh control-timeout.sh control-basic.sh control-workflow.py; do
            if [[ "$name" == *.py ]]; then
              if python3 ".github/5342/$name" > "$evidence/$name.log" 2>&1; then rc=0; else rc=$?; fi
            else
              if bash ".github/5342/$name" > "$evidence/$name.log" 2>&1; then rc=0; else rc=$?; fi
            fi
            printf '%s=%s\n' "$name" "$rc" | tee -a "$evidence/exits.txt"
            if [[ $rc -ne 0 ]] || ! grep -q '^PASS:' "$evidence/$name.log"; then result=1; fi
          done
          exit "$result"
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 5342-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/5342-evidence/
          if-no-files-found: error
          retention-days: 14
