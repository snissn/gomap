name: "5342 candidate cache cold-to-warm qualification (not M0)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  populate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      ROLE: populate
    steps:
      - name: Start retained packet
        run: |
          mkdir -p "$RUNNER_TEMP/5342-populate/tmp"
          printf 'controller=%s\nworkflow=%s\nrun=%s\nattempt=%s\nrole=populate\nproduct=5e1b999069a0e92d2eabb89fef6e1be0fae1c634\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/5342-populate/identity.txt"
      - name: Checkout reviewed controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Checkout fixed candidate with its reviewed baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5e1b999069a0e92d2eabb89fef6e1be0fae1c634
          fetch-depth: 2
          path: product
          persist-credentials: false
      - name: Verify and retain actual source
        working-directory: product
        run: bash ../harness/.github/5342/bind-source.sh
      - name: Run candidate source and wrapper controls once
        working-directory: product
        run: bash ../harness/.github/5342/run-source-controls.sh
      - name: Restore exact candidate consumer cache
        id: setup_go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: product/go.mod
          cache: true
          cache-dependency-path: |
            product/go.sum
            product/.github/workflows/unified-bench-tests.yml
      - name: Retain bounded tool and runner identities
        working-directory: product
        run: |
          evidence="$RUNNER_TEMP/5342-populate"
          if timeout --kill-after=1s 5s go version > "$evidence/go-version.log" 2>&1; then rc=0; else rc=$?; fi
          printf 'exit=%s\n' "$rc" > "$evidence/go-version.exit"
          if timeout --kill-after=1s 5s env GOWORK=off go env GOVERSION GOOS GOARCH > "$evidence/go-env.log" 2>&1; then rc=0; else rc=$?; fi
          printf 'exit=%s\n' "$rc" > "$evidence/go-env.exit"
          printf 'ImageOS=%s\nImageVersion=%s\nrunner_os=%s\nrunner_arch=%s\n' "${ImageOS-unknown}" "${ImageVersion-unknown}" '${{ runner.os }}' '${{ runner.arch }}' > "$evidence/runner.txt"
      - name: Verify populate coverage and run unchanged guardrail
        working-directory: product
        env:
          SETUP_GO_CACHE_HIT: ${{ steps.setup_go.outputs.cache-hit }}
        run: bash ../harness/.github/5342/run-cache-role.sh
      - name: Archive complete packet on every outcome
        if: always()
        run: |
          evidence="$RUNNER_TEMP/5342-populate"
          mkdir -p "$evidence"
          printf 'job_status=%s\n' '${{ job.status }}' > "$evidence/terminal.txt"
          tar -czf "$RUNNER_TEMP/5342-populate.tar.gz" -C "$evidence" .
          sha256sum "$RUNNER_TEMP/5342-populate.tar.gz" > "$RUNNER_TEMP/5342-populate.sha256"
      - name: Upload retained populate packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 5342-cache-populate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/5342-populate.tar.gz
            ${{ runner.temp }}/5342-populate.sha256
          if-no-files-found: error
          retention-days: 30
  restore:
    needs: populate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      ROLE: restore
    steps:
      - name: Start retained packet
        run: |
          mkdir -p "$RUNNER_TEMP/5342-restore/tmp"
          printf 'controller=%s\nworkflow=%s\nrun=%s\nattempt=%s\nrole=restore\nproduct=5e1b999069a0e92d2eabb89fef6e1be0fae1c634\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/5342-restore/identity.txt"
      - name: Checkout reviewed controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Checkout fixed candidate with its reviewed baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5e1b999069a0e92d2eabb89fef6e1be0fae1c634
          fetch-depth: 2
          path: product
          persist-credentials: false
      - name: Verify and retain actual source
        working-directory: product
        run: bash ../harness/.github/5342/bind-source.sh
      - name: Restore exact candidate consumer cache
        id: setup_go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: product/go.mod
          cache: true
          cache-dependency-path: |
            product/go.sum
            product/.github/workflows/unified-bench-tests.yml
      - name: Retain bounded tool and runner identities
        working-directory: product
        run: |
          evidence="$RUNNER_TEMP/5342-restore"
          if timeout --kill-after=1s 5s go version > "$evidence/go-version.log" 2>&1; then rc=0; else rc=$?; fi
          printf 'exit=%s\n' "$rc" > "$evidence/go-version.exit"
          if timeout --kill-after=1s 5s env GOWORK=off go env GOVERSION GOOS GOARCH > "$evidence/go-env.log" 2>&1; then rc=0; else rc=$?; fi
          printf 'exit=%s\n' "$rc" > "$evidence/go-env.exit"
          printf 'ImageOS=%s\nImageVersion=%s\nrunner_os=%s\nrunner_arch=%s\n' "${ImageOS-unknown}" "${ImageVersion-unknown}" '${{ runner.os }}' '${{ runner.arch }}' > "$evidence/runner.txt"
      - name: Verify restore coverage and run unchanged guardrail
        working-directory: product
        env:
          SETUP_GO_CACHE_HIT: ${{ steps.setup_go.outputs.cache-hit }}
        run: bash ../harness/.github/5342/run-cache-role.sh
      - name: Archive complete packet on every outcome
        if: always()
        run: |
          evidence="$RUNNER_TEMP/5342-restore"
          mkdir -p "$evidence"
          printf 'job_status=%s\n' '${{ job.status }}' > "$evidence/terminal.txt"
          tar -czf "$RUNNER_TEMP/5342-restore.tar.gz" -C "$evidence" .
          sha256sum "$RUNNER_TEMP/5342-restore.tar.gz" > "$RUNNER_TEMP/5342-restore.sha256"
      - name: Upload retained restore packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 5342-cache-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/5342-restore.tar.gz
            ${{ runner.temp }}/5342-restore.sha256
          if-no-files-found: error
          retention-days: 30
