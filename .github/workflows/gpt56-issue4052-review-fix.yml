name: GPT-5.6 issue 4052 review fix

on:
  push:
    branches:
      - gpt56/issue-4052-capability-manifest

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/issue-4052-capability-manifest
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/gpt56/issue4052-review-fix.b64 | gzip -dc > /tmp/issue4052-review-fix.patch
          printf '%s  %s\n' '80e84cc53ec718bcb2ac95ba4f77738bddd0361fdc9a62d8ecc6540be2b388d5' /tmp/issue4052-review-fix.patch | sha256sum --check -
          git apply --check /tmp/issue4052-review-fix.patch
          git apply /tmp/issue4052-review-fix.patch
          rm -f .github/gpt56/issue4052-review-fix.b64
          rmdir .github/gpt56
          rm -f .github/workflows/gpt56-issue4052-review-fix.yml
          test -z "$(gofmt -l TreeDB/mongo_gateway/capability_manifest_test.go TreeDB/mongo_gateway/compatibility_matrix_test.go cmd/mongo_gateway_bench/main.go cmd/mongo_gateway_bench/main_test.go)"
          git diff --check
          git add -A
          python3 -c 'import subprocess; actual=set(subprocess.check_output(["git","diff","--cached","--name-only"], text=True).splitlines()); expected=set(".github/gpt56/issue4052-review-fix.b64 .github/workflows/gpt56-issue4052-review-fix.yml TreeDB/mongo_gateway/capability_manifest_test.go TreeDB/mongo_gateway/compatibility_matrix_test.go cmd/mongo_gateway_bench/main.go cmd/mongo_gateway_bench/main_test.go".split()); assert actual == expected, f"unexpected files: missing={sorted(expected-actual)} extra={sorted(actual-expected)}"'
      - name: Validate review fixes
        env:
          TERM: xterm
          GOWORK: 'off'
          GOFLAGS: '-p=1'
          GOMAXPROCS: '2'
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./TreeDB/mongo_gateway -count=1
          go test ./cmd/mongo_gateway_bench -count=1
          go vet ./TreeDB/mongo_gateway ./cmd/mongo_gateway_bench
          make build-treedb
          make build-mongo-gateway
      - name: Commit and publish review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6 Pro'
          git config user.email '1981537+snissn@users.noreply.github.com'
          git commit -m 'mongo: bind probes and benchmark metadata to exercised surface'
          git push origin HEAD:gpt56/issue-4052-capability-manifest
