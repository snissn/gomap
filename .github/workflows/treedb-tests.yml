# PRIVATE DIAGNOSTIC OVERLAY: never open a PR or merge this replacement.
# The preserved manifest is intentionally stale for this non-shipping workflow.
name: "TreeDB: #5341 bounded catalog leader diagnostic"

on:
  workflow_dispatch:
    inputs:
      expected_overlay_sha:
        description: "Externally reviewed exact overlay H SHA (not product SHA)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: catalog-leader-5341-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/5341-hosted-diagnostic-20261030' && github.run_attempt == '1'
    name: catalog leader (${{ matrix.cell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cell: windows-normal
            os: windows-latest
            race: "0"
    env:
      GOWORK: "off"
      GOTOOLCHAIN: "local"
      GOMAXPROCS: "2"
      GOMEMLIMIT: "4GiB"
      EXPECTED_OVERLAY_SHA: ${{ inputs.expected_overlay_sha }}
      WORKFLOW_CONTEXT_SHA: ${{ github.workflow_sha }}
      CELL: ${{ matrix.cell }}
      RACE: ${{ matrix.race }}
    steps:
      - name: Initialize evidence and configure exact hosted Windows checkout
        shell: bash
        run: |
          python -u - <<'PY'
          import datetime, json, os, pathlib, re, subprocess
          packet = pathlib.Path(os.environ['RUNNER_TEMP'])/('catalog-leader-5341-'+os.environ['CELL'])
          packet.mkdir(exist_ok=False)
          setup = {'status':'STARTED','time':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   'event':{k:os.environ.get(k) for k in ('GITHUB_REPOSITORY','GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','RUNNER_ENVIRONMENT','RUNNER_OS')},
                   'expected_overlay_sha':os.environ['EXPECTED_OVERLAY_SHA'],'workflow_context_sha':os.environ['WORKFLOW_CONTEXT_SHA']}
          def save():
              (packet/'setup.json').write_text(json.dumps(setup,indent=2)+'\n')
          save()
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert os.environ['GITHUB_REPOSITORY']=='snissn/gomap'
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' and os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/5341-hosted-diagnostic-20261030'
          assert re.fullmatch('[0-9a-f]{40}',os.environ['EXPECTED_OVERLAY_SHA'])
          assert os.environ['GITHUB_SHA']==os.environ['EXPECTED_OVERLAY_SHA']==os.environ['WORKFLOW_CONTEXT_SHA']
          if os.environ['RUNNER_OS']=='Windows':
              # This changes only this ephemeral hosted runner's Git setting,
              # before BOTH checkout actions. No persistent/self-hosted host.
              with (packet/'git-longpaths.log').open('wb') as output:
                  subprocess.run(['git','config','--global','core.autocrlf','false'],check=True,stdout=output,stderr=subprocess.STDOUT,timeout=30)
                  autocrlf=subprocess.run(['git','config','--global','--get','core.autocrlf'],check=True,stdout=subprocess.PIPE,stderr=output,timeout=30)
                  output.write(autocrlf.stdout)
                  subprocess.run(['git','config','--global','core.longpaths','true'],check=True,stdout=output,stderr=subprocess.STDOUT,timeout=30)
                  result=subprocess.run(['git','config','--global','--get','core.longpaths'],check=True,stdout=subprocess.PIPE,stderr=output,timeout=30)
                  output.write(result.stdout)
              assert autocrlf.stdout.decode().strip()=='false'
              assert result.stdout.decode().strip()=='true'
              setup['windows_git_core_autocrlf']='false'
              setup['windows_git_core_longpaths']='true'
          setup['status']='READY';save()
          PY
      - name: Checkout exact event workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout reviewed diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 76208bfccc0650b8c3de959a6a7adfc81f555bc6
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Setup fixed Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: false
      - name: Verify binding, build once, run exact focused tests once
        shell: bash
        run: |
          python -u - <<'PY'
          import datetime, hashlib, json, os, pathlib, platform, re, subprocess, sys
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          product, harness = root/'product', root/'harness'
          cell = os.environ['CELL']
          packet = pathlib.Path(os.environ['RUNNER_TEMP'])/('catalog-leader-5341-'+cell)
          assert packet.is_dir()
          candidate = '76208bfccc0650b8c3de959a6a7adfc81f555bc6'
          source_tree = '268ac288cd989a376c261398f23f59455d6504ff'
          receipt = {'scope':'DIAGNOSTIC_ONLY_NOT_REPAIR_OR_CI_QUALIFICATION','cell':cell,'source':candidate,'tree':source_tree,'commands':[]}
          def save():
              (packet/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          def sha(path):
              return {'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'bytes':path.stat().st_size}
          def git(where,*args):
              return subprocess.check_output(['git','-C',str(where),*args]).decode().strip()
          def call(label,args,cwd,timeout):
              item={'label':label,'argv':args,'cwd':str(cwd),'timeout_seconds':timeout,'started':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              receipt['commands'].append(item);save()
              log=packet/(label+'.log')
              with log.open('wb') as out:
                  try:
                      result=subprocess.run(args,cwd=cwd,stdout=out,stderr=subprocess.STDOUT,env=env,timeout=timeout)
                      item['exit_code']=result.returncode
                  except subprocess.TimeoutExpired:
                      item['timeout']=True;item['exit_code']=None
              item['completed']=datetime.datetime.now(datetime.timezone.utc).isoformat();item['log']=sha(log);save()
              sys.stdout.buffer.write(log.read_bytes());sys.stdout.buffer.flush()
              if item['exit_code']!=0: raise RuntimeError(label+' failed; retained command and output')
              return log
          save()
          try:
              event={k:os.environ.get(k) for k in ('GITHUB_REPOSITORY','GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_SHA','GITHUB_WORKFLOW_REF','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','RUNNER_ENVIRONMENT','RUNNER_OS','RUNNER_ARCH','ImageOS','ImageVersion')}
              receipt['event']=event;receipt['expected_overlay_sha']=os.environ['EXPECTED_OVERLAY_SHA'];receipt['workflow_context_sha']=os.environ['WORKFLOW_CONTEXT_SHA'];save()
              assert event['GITHUB_REPOSITORY']=='snissn/gomap'
              assert event['GITHUB_EVENT_NAME']=='workflow_dispatch' and event['GITHUB_RUN_ATTEMPT']=='1'
              assert event['GITHUB_REF']=='refs/heads/codex/5341-hosted-diagnostic-20261030'
              assert event['GITHUB_WORKFLOW_REF']=='snissn/gomap/.github/workflows/treedb-tests.yml@'+event['GITHUB_REF']
              assert re.fullmatch('[0-9a-f]{40}',os.environ['EXPECTED_OVERLAY_SHA'])
              assert event['GITHUB_SHA']==os.environ['EXPECTED_OVERLAY_SHA']==os.environ['WORKFLOW_CONTEXT_SHA']==git(harness,'rev-parse','HEAD')
              assert event['RUNNER_ENVIRONMENT']=='github-hosted'
              assert cell=='windows-normal' and os.environ['RACE']=='0'
              assert (platform.system()=='Windows')==(cell=='windows-normal')
              assert os.environ['RACE']==('1' if cell=='linux-race' else '0')
              assert git(product,'rev-parse','HEAD')==candidate and git(product,'rev-parse','HEAD^{tree}')==source_tree
              assert git(harness,'diff','--name-only',candidate,'HEAD').splitlines()==['.github/workflows/treedb-tests.yml']
              assert git(product,'status','--porcelain')==git(harness,'status','--porcelain')==''
              receipt['source_parents']=git(product,'show','-s','--format=%P','HEAD')
              receipt['source_manifest']=sha(product/'.github/ci/ci_impact.json')
              receipt['workflow']=sha(harness/'.github/workflows/treedb-tests.yml')
              (packet/'workflow.yml').write_bytes((harness/'.github/workflows/treedb-tests.yml').read_bytes())
              (packet/'diagnostic.patch').write_bytes(subprocess.check_output(['git','-C',str(product),'diff','--binary','34b54d70c8b7af201b25e84602d0856b76a682f7',candidate]))
              temporary=pathlib.Path(os.environ['RUNNER_TEMP'])/('catalog-leader-5341-tmp-'+cell);temporary.mkdir(exist_ok=False)
              env=os.environ.copy();env['TMPDIR']=env['TMP']=env['TEMP']=str(temporary)
              receipt['environment']={k:env.get(k) for k in ('GOWORK','GOTOOLCHAIN','GOMAXPROCS','GOMEMLIMIT','GOFLAGS','GODEBUG','CGO_ENABLED')};save()
              version=call('go-version',['go','version'],product,30)
              assert 'go1.26.10' in version.read_text()
              call('go-env',['go','env','-json','GOOS','GOARCH','CGO_ENABLED','GOWORK','GOTOOLCHAIN','GOFLAGS'],product,30)
              binary=packet/('raftplacement.test.exe' if cell=='windows-normal' else 'raftplacement.test')
              args=['go','test','-c','-o',str(binary)]
              if cell=='linux-race': args.append('-race')
              args.append('./TreeDB/internal/raftplacement')
              call('build',args,product,900);receipt['binary']=sha(binary);save()
              tests=['TestCatalogMetaBackupRestoresFreshThreeAuthorityClusterAndSurvivesReopenFailoverRejoin']
              if cell!='windows-normal': tests+=['TestCatalogMetaLeaderDwellRestartsAfterObservationGapV1','TestCatalogMetaLeaderDwellRestartsAfterProbeFailureV1','TestRealCatalogMetaRaftConfigAddsSchedulingHeadroom']
              receipt['expected_tests']=tests;save()
              regex='^('+'|'.join(map(re.escape,tests))+')$'
              outer='5m' if cell=='linux-race' else '3m'
              log=call('focused',[str(binary),'-test.v','-test.count=1','-test.run='+regex,'-test.timeout='+outer],product/'TreeDB/internal/raftplacement',360 if cell=='linux-race' else 240)
              outcomes=re.findall(r'^--- (PASS|FAIL|SKIP): (\S+)',log.read_text(errors='replace'),re.MULTILINE)
              receipt['test_outcomes']=outcomes;save()
              assert sorted(outcomes)==sorted(('PASS',name) for name in tests)
              assert 'DATA RACE' not in log.read_text(errors='replace')
              receipt['outcome']='FOCUSED_PASS_NOT_INCIDENT_CLOSURE';save()
          except BaseException as error:
              receipt['outcome']='FAILED_OR_INVALID';receipt['error']=repr(error);save();raise
          PY
      - name: Retain exact receipts and failure output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-leader-5341-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-leader-5341-${{ matrix.cell }}
          if-no-files-found: error
          retention-days: 14
