name: "TreeDB: vet+test"
run-name: "Windows full-process handle discrimination: base/common-A/R (advisory)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-handle-diagnostic:
    name: Windows pinned-source handle diagnostic (advisory)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GOMEMLIMIT: 4GiB
      GOMAXPROCS: 2
      GOWORK: "off"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup original CI Go version
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - name: Serial original tests then conditional advisory error stacks
        shell: pwsh
        run: python .github/diagnostics/windows_handle_discrimination.py "$env:RUNNER_TEMP/windows-handle-packet"
      - name: Retain complete packet even on original failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-handle-full-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-handle-packet/
          if-no-files-found: error
          retention-days: 30
