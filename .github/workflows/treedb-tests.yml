name: "TreeDB: vet+test"

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
            timeout: 15
            shard_kind: all
          - name: macos-latest
            os: macos-latest
            timeout: 15
            shard_kind: all
          - name: windows-core
            os: windows-latest
            timeout: 25
            shard_kind: windows-core
          - name: windows-caching-heavy
            os: windows-latest
            timeout: 25
            shard_kind: windows-caching-heavy
          - name: windows-caching-rest-1
            os: windows-latest
            timeout: 25
            shard_kind: windows-caching-rest
            rest_shard_index: 0
            rest_shard_count: 3
          - name: windows-caching-rest-2
            os: windows-latest
            timeout: 25
            shard_kind: windows-caching-rest
            rest_shard_index: 1
            rest_shard_count: 3
          - name: windows-caching-rest-3
            os: windows-latest
            timeout: 25
            shard_kind: windows-caching-rest
            rest_shard_index: 2
            rest_shard_count: 3
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: |
            go.sum

      - name: Vet
        if: ${{ matrix.shard_kind != 'windows-caching-heavy' && matrix.shard_kind != 'windows-caching-rest' }}
        working-directory: TreeDB
        run: go vet ./...

      - name: Test
        working-directory: TreeDB
        shell: bash
        env:
          GOMEMLIMIT: 4GiB
          GOMAXPROCS: 2
        run: |
          set -o pipefail
          case "${{ matrix.shard_kind }}" in
            all)
              go test -json -timeout 30m -p 1 ./... | tee treedb-test.jsonl
              ;;
            windows-core)
              packages=$(go list ./... | grep -v '^github.com/snissn/gomap/TreeDB/caching$')
              go test -json -timeout 30m -p 1 $packages | tee treedb-test.jsonl
              ;;
            windows-caching-heavy)
              heavy_file="$(mktemp)"
              tr -d '\r' < ../.github/ci/treedb_windows_caching_heavy_tests.txt | grep -v '^#' | sed '/^$/d' > "$heavy_file"
              regex="^($(paste -sd'|' "$heavy_file"))$"
              echo "TreeDB/caching heavy regex=${regex}"
              go test -json -timeout 30m -p 1 ./caching -run "$regex" | tee treedb-test.jsonl
              rm -f "$heavy_file"
              ;;
            windows-caching-rest)
              heavy_file="$(mktemp)"
              rest_file="$(mktemp)"
              rest_shard_file="$(mktemp)"
              tr -d '\r' < ../.github/ci/treedb_windows_caching_heavy_tests.txt | grep -v '^#' | sed '/^$/d' > "$heavy_file"
              go test ./caching -list 'Test.*' | tr -d '\r' | grep '^Test' | grep -F -x -v -f "$heavy_file" > "$rest_file"
              rest_shard_index="${{ matrix.rest_shard_index }}"
              rest_shard_count="${{ matrix.rest_shard_count }}"
              if [ -z "$rest_shard_index" ]; then
                rest_shard_index=0
              fi
              if [ -z "$rest_shard_count" ] || [ "$rest_shard_count" -lt 1 ]; then
                rest_shard_count=1
              fi
              awk -v idx="$rest_shard_index" -v n="$rest_shard_count" 'BEGIN { c = 0 } { if ((c % n) == idx) print; c++ }' "$rest_file" > "$rest_shard_file"
              rest_regex="^($(paste -sd'|' "$rest_shard_file"))$"
              if [ "$rest_regex" = '^()$' ]; then
                echo "no non-heavy caching tests found for shard ${rest_shard_index}/${rest_shard_count}" >&2
                rm -f "$heavy_file" "$rest_file" "$rest_shard_file"
                exit 1
              fi
              echo "TreeDB/caching rest shard=${rest_shard_index}/${rest_shard_count} regex=${rest_regex}"
              go test -json -timeout 30m -p 1 ./caching -run "$rest_regex" | tee treedb-test.jsonl
              rm -f "$heavy_file" "$rest_file" "$rest_shard_file"
              ;;
            *)
              echo "unknown shard kind: ${{ matrix.shard_kind }}" >&2
              exit 1
              ;;
          esac

      - name: Summarize test timings
        if: always()
        working-directory: TreeDB
        shell: bash
        run: |
          python ../.github/scripts/summarize_go_test_json.py treedb-test.jsonl | tee treedb-test-summary.md
          {
            echo "### TreeDB test timing summary (${{ matrix.name }})"
            echo
            cat treedb-test-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treedb-test-json-${{ matrix.name }}
          path: |
            TreeDB/treedb-test.jsonl
            TreeDB/treedb-test.jsonl.summary.md

  race:
    name: race-check (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Test Race
        working-directory: TreeDB
        shell: bash
        run: |
          set -o pipefail
          GOMEMLIMIT=4GiB GOMAXPROCS=2 go test -json -race -p 1 ./... | tee treedb-race.jsonl

      - name: Summarize race timing
        if: always()
        working-directory: TreeDB
        shell: bash
        run: |
          python ../.github/scripts/summarize_go_test_json.py treedb-race.jsonl | tee treedb-race-summary.md
          {
            echo "### TreeDB race timing summary"
            echo
            cat treedb-race-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload race timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treedb-race-json-linux
          path: |
            TreeDB/treedb-race.jsonl
            TreeDB/treedb-race.jsonl.summary.md

  perf:
    name: perf-smoke (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: ValueLog dict compressibility bench
        run: |
          go test ./TreeDB/internal/valuelog -run '^$' \
            -bench 'BenchmarkValueLogDictCompressibilitySweep/valsize=1024/(highly_compressible_tail64|medium_compressible|incompressible)/dict_(off|on)/k=4$' \
            -benchmem -count=5 | tee vlog_dict_bench.txt

      - name: Perf baseline checker (gate)
        run: |
          go run .github/scripts/check_vlog_dict_bench.go \
            -bench-output vlog_dict_bench.txt \
            -baseline .github/perf_baselines/vlog_dict_defaults.json \
            -strict=true

      - name: Incompressible auto-vs-off gate
        run: |
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            off_log="vlog_auto_incompressible_off_attempt${attempt}.txt"
            auto_log="vlog_auto_incompressible_auto_attempt${attempt}.txt"
            echo "incompressible gate attempt ${attempt}/${max_attempts}"

            if ! go run ./cmd/unified_bench \
              -keys 1000000 \
              -valsize 512 \
              -batchsize 1024 \
              -dbs treedb_vlog_off \
              -test batch_write \
              -val-pattern random \
              -format markdown \
              -progress=false \
              -keep=false \
              -seed 1 \
              -treedb-force-value-pointers=true \
              -treedb-value-log-threshold=1 \
              -treedb-vlog-dict-train-bytes=-1 \
              > "${off_log}" 2>&1; then
              echo "treedb_vlog_off benchmark failed on attempt ${attempt}"
              tail -n 80 "${off_log}" || true
              continue
            fi

            if ! go run ./cmd/unified_bench \
              -keys 1000000 \
              -valsize 512 \
              -batchsize 1024 \
              -dbs treedb_vlog_auto \
              -test batch_write \
              -val-pattern random \
              -format markdown \
              -progress=false \
              -keep=false \
              -seed 1 \
              -treedb-force-value-pointers=true \
              -treedb-value-log-threshold=1 \
              -treedb-vlog-dict-train-bytes=-1 \
              > "${auto_log}" 2>&1; then
              echo "treedb_vlog_auto benchmark failed on attempt ${attempt}"
              tail -n 80 "${auto_log}" || true
              continue
            fi

            if go run .github/scripts/check_vlog_auto_incompressible.go \
              -off-log "${off_log}" \
              -auto-log "${auto_log}" \
              -min-throughput-frac 0.95 \
              -max-size-frac 1.02; then
              exit 0
            fi

            echo "incompressible gate threshold check failed on attempt ${attempt}"
            tail -n 80 "${off_log}" || true
            tail -n 80 "${auto_log}" || true
          done

          echo "incompressible auto-vs-off gate failed after ${max_attempts} attempts"
          exit 1
