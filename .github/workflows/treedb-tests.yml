name: Recovery three focused budget correctness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-three-focused-budget-correctness
  cancel-in-progress: false

jobs:
  correctness:
    name: ${{ matrix.role }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: windows-normal
            runner: windows-latest
            minutes: 20
            race_flag: ''
          - role: linux-race
            runner: ubuntu-24.04
            minutes: 20
            race_flag: '-race'
    env:
      GOWORK: 'off'
      GOMEMLIMIT: 4GiB
      GOMAXPROCS: '2'
      PRODUCT_SHA: bf3571ccd6ccefe23e97990c3afc3da3d9463e67
      PRODUCT_TREE: 5ee9fb168c6f3bb2dd6bbd0d0f1199a74f44949f
      RACE_FLAG: ${{ matrix.race_flag }}
      ROLE: ${{ matrix.role }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure literal checkout before fetch
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          git config --global core.autocrlf false
          test "$(git config --global --get core.longpaths)" = true
          test "$(git config --global --get core.autocrlf)" = false

      - name: Checkout immutable product
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bf3571ccd6ccefe23e97990c3afc3da3d9463e67
          fetch-depth: 1
          persist-credentials: false

      - name: Retain source and controller identity
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_ENVIRONMENT_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          mkdir -p diagnostic-evidence diagnostic-binaries
          {
            echo "controller_sha=$CONTROLLER_SHA workflow_sha=$WORKFLOW_SHA workflow_ref=$WORKFLOW_REF"
            echo "product_sha=$(git rev-parse HEAD) product_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "run_id=$RUN_ID attempt=$RUN_ATTEMPT role=$ROLE runner_environment=$RUNNER_ENVIRONMENT_KIND"
            echo "GOWORK=$GOWORK GOMEMLIMIT=$GOMEMLIMIT GOMAXPROCS=$GOMAXPROCS RACE_FLAG=$RACE_FLAG"
          } | tee diagnostic-evidence/identity.txt
          test "$RUNNER_ENVIRONMENT_KIND" = github-hosted
          test "$(git config --get core.longpaths)" = true
          test "$(git config --get core.autocrlf)" = false
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"

      - name: Setup Go 1.26.10
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false

      - name: Compile each package once and bind binaries
        id: build
        run: |
          set -euo pipefail
          go version | tee diagnostic-evidence/go-version.txt
          go env GOOS GOARCH GOVERSION GOTOOLCHAIN CGO_ENABLED | tee diagnostic-evidence/go-env.txt
          test "$(go env GOVERSION)" = go1.26.10
          pwd -P > diagnostic-evidence/build-cwd.txt
          flags=(-p 1)
          if test -n "$RACE_FLAG"; then flags+=("$RACE_FLAG"); fi
          for package in root db raftplacement; do
            case "$package" in
              root) import=./TreeDB ;;
              db) import=./TreeDB/db ;;
              raftplacement) import=./TreeDB/internal/raftplacement ;;
            esac
            command=(go test -c "${flags[@]}" -o "diagnostic-binaries/$package.test.exe" "$import")
            printf '%q ' "${command[@]}" > "diagnostic-evidence/$package-build-command.txt"
            printf '\n' >> "diagnostic-evidence/$package-build-command.txt"
            "${command[@]}" 2>&1 | tee "diagnostic-evidence/$package-build.log"
            sha256sum "diagnostic-binaries/$package.test.exe" | tee "diagnostic-evidence/$package-binary-sha256.txt"
          done

      - name: DB metadata reuse original correctness cases
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          regex='^TestDurableRootMetadataReuse(ProcessCut|LowPlacementAndFallback|MultipageManifest)4627$'
          evidence_dir="$PWD/diagnostic-evidence"
          binary_path="$PWD/diagnostic-binaries/db.test.exe"
          package_dir="$PWD/TreeDB/db"
          echo "GOWORK=$GOWORK GOMEMLIMIT=$GOMEMLIMIT GOMAXPROCS=$GOMAXPROCS RACE_FLAG=$RACE_FLAG" > "$evidence_dir/db-env.txt"
          command=(go tool test2json -t -p github.com/snissn/gomap/TreeDB/db "$binary_path" -test.v=test2json -test.count=1 -test.timeout=3m "-test.run=$regex")
          printf '%q ' "${command[@]}" > "$evidence_dir/db-command.txt"
          printf '\n' >> "$evidence_dir/db-command.txt"
          (
            cd "$package_dir"
            pwd -P > "$evidence_dir/db-cwd.txt"
            "${command[@]}"
          ) 2>&1 | tee "$evidence_dir/db-test.jsonl"

      - name: Root original ACK stable-image correctness
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          regex='^TestOrderedCompletionStableImageAtAcknowledgement$'
          evidence_dir="$PWD/diagnostic-evidence"
          binary_path="$PWD/diagnostic-binaries/root.test.exe"
          package_dir="$PWD/TreeDB"
          echo "GOWORK=$GOWORK GOMEMLIMIT=$GOMEMLIMIT GOMAXPROCS=$GOMAXPROCS RACE_FLAG=$RACE_FLAG" > "$evidence_dir/root-env.txt"
          command=(go tool test2json -t -p github.com/snissn/gomap/TreeDB "$binary_path" -test.v=test2json -test.count=1 -test.timeout=3m "-test.run=$regex")
          printf '%q ' "${command[@]}" > "$evidence_dir/root-command.txt"
          printf '\n' >> "$evidence_dir/root-command.txt"
          (
            cd "$package_dir"
            pwd -P > "$evidence_dir/root-cwd.txt"
            "${command[@]}"
          ) 2>&1 | tee "$evidence_dir/root-test.jsonl"

      - name: Catalog original lifecycle and four existing dwell/config controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          regex='^(TestCatalogMetaBackupRestoresFreshThreeAuthorityClusterAndSurvivesReopenFailoverRejoin|TestCatalogMetaLeaderDwellRestartsAfterObservationGapV1|TestCatalogMetaLeaderDwellRestartsAfterProbeFailureV1|TestRealCatalogMetaRaftConfigAddsSchedulingHeadroom|TestCatalogMetaLifecycleHarnessRaftConfigProvidesSchedulingHeadroomV1)$'
          evidence_dir="$PWD/diagnostic-evidence"
          binary_path="$PWD/diagnostic-binaries/raftplacement.test.exe"
          package_dir="$PWD/TreeDB/internal/raftplacement"
          echo "GOWORK=$GOWORK GOMEMLIMIT=$GOMEMLIMIT GOMAXPROCS=$GOMAXPROCS RACE_FLAG=$RACE_FLAG" > "$evidence_dir/raftplacement-env.txt"
          command=(go tool test2json -t -p github.com/snissn/gomap/TreeDB/internal/raftplacement "$binary_path" -test.v=test2json -test.count=1 -test.timeout=3m "-test.run=$regex")
          printf '%q ' "${command[@]}" > "$evidence_dir/raftplacement-command.txt"
          printf '\n' >> "$evidence_dir/raftplacement-command.txt"
          (
            cd "$package_dir"
            pwd -P > "$evidence_dir/raftplacement-cwd.txt"
            "${command[@]}"
          ) 2>&1 | tee "$evidence_dir/raftplacement-test.jsonl"

      - name: Retain native evidence even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-focused-budget-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-evidence/
          if-no-files-found: warn
          retention-days: 14
