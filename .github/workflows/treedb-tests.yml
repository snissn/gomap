name: Recovery three first causal pass

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-three-first-causal-pass
  cancel-in-progress: false

jobs:
  correctness:
    name: ${{ matrix.role }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: windows-normal
            runner: windows-latest
            minutes: 45
            race_flag: ''
          - role: linux-race-controls
            runner: ubuntu-24.04
            minutes: 20
            race_flag: '-race'
    env:
      GOWORK: 'off'
      GOMEMLIMIT: 4GiB
      GOMAXPROCS: '2'
      PRODUCT_SHA: 88b5c127dfb12291bed221cc012bfc078dcb8c3b
      PRODUCT_TREE: c19f797e6b86c34adc53f6b9050229f3b6142e19
      RACE_FLAG: ${{ matrix.race_flag }}
      ROLE: ${{ matrix.role }}
      ACK_LEDGER_CONTROL_REGEX: '^TestACKRecoveryLedgerRejectsOriginalPublicOpenFailure$'
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure literal checkout before fetch
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          git config --global core.autocrlf false
          test "$(git config --global --get core.longpaths)" = true
          test "$(git config --global --get core.autocrlf)" = false

      - name: Checkout immutable product
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 88b5c127dfb12291bed221cc012bfc078dcb8c3b
          fetch-depth: 1
          persist-credentials: false

      - name: Retain source and controller identity
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_ENVIRONMENT_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          mkdir -p diagnostic-evidence diagnostic-binaries
          {
            echo "controller_sha=$CONTROLLER_SHA workflow_sha=$WORKFLOW_SHA workflow_ref=$WORKFLOW_REF"
            echo "product_sha=$(git rev-parse HEAD) product_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "run_id=$RUN_ID attempt=$RUN_ATTEMPT role=$ROLE runner_environment=$RUNNER_ENVIRONMENT_KIND"
            echo "GOWORK=$GOWORK GOMEMLIMIT=$GOMEMLIMIT GOMAXPROCS=$GOMAXPROCS RACE_FLAG=$RACE_FLAG"
          } | tee diagnostic-evidence/identity.txt
          test "$RUNNER_ENVIRONMENT_KIND" = github-hosted
          test "$(git config --get core.longpaths)" = true
          test "$(git config --get core.autocrlf)" = false
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          sha256sum .github/ci/recovery-resolution/*-member-regex.txt | tee diagnostic-evidence/regex-sha256.txt

      - name: Setup Go 1.26.10
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false

      - name: Compile each package once and bind binaries
        id: build
        run: |
          set -euo pipefail
          go version | tee diagnostic-evidence/go-version.txt
          go env GOOS GOARCH GOVERSION GOTOOLCHAIN CGO_ENABLED | tee diagnostic-evidence/go-env.txt
          test "$(go env GOVERSION)" = go1.26.10
          flags=(-p 1)
          if test -n "$RACE_FLAG"; then flags+=("$RACE_FLAG"); fi
          for package in root db raftplacement; do
            case "$package" in
              root) import=./TreeDB ;;
              db) import=./TreeDB/db ;;
              raftplacement) import=./TreeDB/internal/raftplacement ;;
            esac
            command=(go test -c "${flags[@]}" -o "diagnostic-binaries/$package.test.exe" "$import")
            printf '%q ' "${command[@]}" > "diagnostic-evidence/$package-build-command.txt"
            printf '\n' >> "diagnostic-evidence/$package-build-command.txt"
            "${command[@]}" 2>&1 | tee "diagnostic-evidence/$package-build.log"
            sha256sum "diagnostic-binaries/$package.test.exe" | tee "diagnostic-evidence/$package-binary-sha256.txt"
          done

      - name: DB original 106-member plus labeled witness support, or race control only
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          if test "$ROLE" = windows-normal; then
            regex=$(cat .github/ci/recovery-resolution/5318-original-db-member-regex.txt)
            timeout=30m
            echo 'original observed DB106 member + TestMetadataReuseCutWitness4627 support' > diagnostic-evidence/db-selection.txt
          else
            regex='^TestMetadataReuseCutWitness4627$'
            timeout=3m
            echo 'new witness control only; no original DB lifecycle' > diagnostic-evidence/db-selection.txt
          fi
          echo "GOWORK=$GOWORK GOMEMLIMIT=$GOMEMLIMIT GOMAXPROCS=$GOMAXPROCS GOMAP_RECOVERY_LEDGER=${GOMAP_RECOVERY_LEDGER-unset}" > diagnostic-evidence/db-env.txt
          command=(go tool test2json -t -p github.com/snissn/gomap/TreeDB/db "$PWD/diagnostic-binaries/db.test.exe" -test.v=test2json -test.count=1 "-test.timeout=$timeout" "-test.run=$regex")
          printf '%q ' "${command[@]}" > diagnostic-evidence/db-command.txt
          printf '\n' >> diagnostic-evidence/db-command.txt
          "${command[@]}" 2>&1 | tee diagnostic-evidence/db-test.jsonl

      - name: Root original 100-member with ACK ledger, or race ledger controls only
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          if test "$ROLE" = windows-normal; then
            regex=$(cat .github/ci/recovery-resolution/5340-original-root-member-regex.txt)
            timeout=30m
            export GOMAP_RECOVERY_LEDGER=1
          else
            regex="$ACK_LEDGER_CONTROL_REGEX"
            timeout=3m
          fi
          echo "GOWORK=$GOWORK GOMEMLIMIT=$GOMEMLIMIT GOMAXPROCS=$GOMAXPROCS GOMAP_RECOVERY_LEDGER=${GOMAP_RECOVERY_LEDGER-unset}" > diagnostic-evidence/root-env.txt
          command=(go tool test2json -t -p github.com/snissn/gomap/TreeDB "$PWD/diagnostic-binaries/root.test.exe" -test.v=test2json -test.count=1 "-test.timeout=$timeout" "-test.run=$regex")
          printf '%q ' "${command[@]}" > diagnostic-evidence/root-command.txt
          printf '\n' >> diagnostic-evidence/root-command.txt
          "${command[@]}" 2>&1 | tee diagnostic-evidence/root-test.jsonl

      - name: Catalog original scenario and five controls, or race log-tail control only
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          if test "$ROLE" = windows-normal; then
            regex='^(TestCatalogMetaBackupRestoresFreshThreeAuthorityClusterAndSurvivesReopenFailoverRejoin|TestCatalogMetaRaftLogTailRetainsBoundedSuffixV1|TestCatalogMetaLeaderDwellRestartsAfterObservationGapV1|TestCatalogMetaLeaderDwellRestartsAfterProbeFailureV1|TestRealCatalogMetaRaftConfigAddsSchedulingHeadroom|TestCatalogMetaLifecycleHarnessRaftConfigProvidesSchedulingHeadroomV1)$'
          else
            regex='^TestCatalogMetaRaftLogTailRetainsBoundedSuffixV1$'
          fi
          echo "GOWORK=$GOWORK GOMEMLIMIT=$GOMEMLIMIT GOMAXPROCS=$GOMAXPROCS GOMAP_RECOVERY_LEDGER=${GOMAP_RECOVERY_LEDGER-unset}" > diagnostic-evidence/raftplacement-env.txt
          command=(go tool test2json -t -p github.com/snissn/gomap/TreeDB/internal/raftplacement "$PWD/diagnostic-binaries/raftplacement.test.exe" -test.v=test2json -test.count=1 -test.timeout=3m "-test.run=$regex")
          printf '%q ' "${command[@]}" > diagnostic-evidence/raftplacement-command.txt
          printf '\n' >> diagnostic-evidence/raftplacement-command.txt
          "${command[@]}" 2>&1 | tee diagnostic-evidence/raftplacement-test.jsonl

      - name: Paired producer and ledger race controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.role == 'linux-race-controls' }}
        run: |
          set -euo pipefail
          regex='^Test(Ledger(BoundedOwnershipAndOverflow|SingleInstallationAndRestore|ConcurrentPublicationAndRead)|StableResourceFileSyncObserverExactPhysicalBoundary|RecoveryLedger(PhysicalAbnormalExitHasNoReturn|StoragePhaseErrorsPreserveOriginalOrder))$'
          command=(go test -json -race -p 1 -count=1 -timeout=3m ./TreeDB/internal/recoverytrace ./TreeDB/internal/rootpublication ./TreeDB/db -run "$regex")
          printf '%q ' "${command[@]}" > diagnostic-evidence/paired-controls-command.txt
          printf '\n' >> diagnostic-evidence/paired-controls-command.txt
          "${command[@]}" 2>&1 | tee diagnostic-evidence/paired-controls-test.jsonl

      - name: Retain native evidence even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-first-causal-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-evidence/
          if-no-files-found: warn
          retention-days: 14
