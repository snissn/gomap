# PRIVATE DIAGNOSTIC OVERLAY ONLY: never PR/merge; inventory intentionally stale.
name: "TreeDB: #5338 bounded frontier custody diagnostic"
on:
  workflow_dispatch:
    inputs:
      expected_overlay_sha:
        description: "Externally pinned reviewed workflow commit H"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-frontier-5338-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/5338-frontier-hosted-20261030' && github.run_attempt == '1'
    name: frontier custody (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cell: linux-normal
            race: "0"
          - cell: linux-race
            race: "1"
    env:
      GOWORK: "off"
      GOTOOLCHAIN: "local"
      GOMAXPROCS: "2"
      GOMEMLIMIT: "4GiB"
      EXPECTED_OVERLAY_SHA: ${{ inputs.expected_overlay_sha }}
      WORKFLOW_CONTEXT_SHA: ${{ github.workflow_sha }}
      CELL: ${{ matrix.cell }}
      RACE: ${{ matrix.race }}
    steps:
      - name: Initialize early evidence
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/('native-frontier-5338-'+os.environ['CELL'])
          p.mkdir(exist_ok=False)
          (p/'setup.json').write_text(json.dumps({k:os.environ.get(k) for k in ('GITHUB_SHA','GITHUB_REF','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','CELL','RUNNER_ENVIRONMENT')},indent=2)+'\n')
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          PY
      - name: Checkout exact workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout frozen reviewed product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b1c6829204e53a65803a88e508146f61e0faed04
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Setup fixed Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: false
      - name: Bind source and run each focused group once
        shell: bash
        run: |
          python3 -u - <<'PY'
          import datetime,hashlib,json,os,pathlib,re,subprocess,traceback
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']);product=root/'product';harness=root/'harness'
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/('native-frontier-5338-'+os.environ['CELL'])
          receipt={'scope':'DIAGNOSTIC_ONLY_NOT_REPAIR_OR_CI_QUALIFICATION','commands':[],'groups':[]}
          def save(): (p/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          def git(at,*args): return subprocess.check_output(['git','-C',str(at),*args],timeout=30)
          def digest(b): return {'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          def call(label,args,cwd,limit):
              log=p/(label+'.log');r={'label':label,'argv':args,'cwd':str(cwd),'timeout_seconds':limit,'started':datetime.datetime.now(datetime.timezone.utc).isoformat()};receipt['commands'].append(r);save()
              try:
                  with log.open('wb') as f:
                      result=subprocess.run(args,cwd=cwd,stdout=f,stderr=subprocess.STDOUT,timeout=limit)
                  r['exit_code']=result.returncode
              except subprocess.TimeoutExpired:
                  r['timeout']=True;r['exit_code']=None
              finally:
                  r['completed']=datetime.datetime.now(datetime.timezone.utc).isoformat();r['log']=digest(log.read_bytes());save()
              return r.get('exit_code')==0,log.read_text(errors='replace')
          try:
              assert p.is_dir()
              expected=os.environ['EXPECTED_OVERLAY_SHA'];assert re.fullmatch('[0-9a-f]{40}',expected)
              assert os.environ['GITHUB_REPOSITORY']=='snissn/gomap' and os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
              assert os.environ['GITHUB_RUN_ATTEMPT']=='1' and os.environ['GITHUB_REF']=='refs/heads/codex/5338-frontier-hosted-20261030'
              assert os.environ['GITHUB_WORKFLOW_REF']=='snissn/gomap/.github/workflows/treedb-tests.yml@refs/heads/codex/5338-frontier-hosted-20261030'
              assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted' and os.environ['RUNNER_OS']=='Linux'
              cell=os.environ['CELL'];assert cell in ('linux-normal','linux-race')
              assert os.environ['RACE']==('1' if cell=='linux-race' else '0')
              assert expected==os.environ['GITHUB_SHA']==os.environ['WORKFLOW_CONTEXT_SHA']==git(harness,'rev-parse','HEAD').decode().strip()
              source='b1c6829204e53a65803a88e508146f61e0faed04';tree='69e5ab003a5a062bf3322fd79ae4951ca7531abc'
              assert git(product,'rev-parse','HEAD').decode().strip()==source and git(product,'rev-parse','HEAD^{tree}').decode().strip()==tree
              assert not git(product,'status','--porcelain') and not git(harness,'status','--porcelain')
              assert git(harness,'diff','--name-only',source,expected).decode().splitlines()==['.github/workflows/treedb-tests.yml']
              workflow=(harness/'.github/workflows/treedb-tests.yml').read_bytes();assert workflow==git(harness,'show',expected+':.github/workflows/treedb-tests.yml')
              (p/'workflow.yml').write_bytes(workflow)
              patch=git(product,'diff','--binary','d7db5409e20412f4dac4e1a3f902484b05e014e1',source);(p/'product-from-main.patch').write_bytes(patch)
              manifest=git(product,'ls-tree','-r','HEAD');(p/'source-manifest.txt').write_bytes(manifest)
              actual_sources={}
              for entry in git(product,'ls-tree','-rz','HEAD').split(b'\0'):
                  if not entry:continue
                  metadata,name=entry.split(b'\t',1);path=name.decode();mode,kind,blob=metadata.decode().split()
                  if not (path.endswith('.go') or path in ('go.mod','go.sum')):continue
                  assert kind=='blob' and mode in ('100644','100755')
                  data=(product/path).read_bytes()
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob, 'literal source differs: '+path
                  actual_sources[path]=digest(data)
              actual_manifest=(json.dumps(actual_sources,sort_keys=True,indent=2)+'\n').encode();(p/'actual-source-bytes.json').write_bytes(actual_manifest)
              receipt['actual_source_bytes']=digest(actual_manifest)
              receipt.update(source=source,tree=tree,overlay=expected,cell=cell,workflow=digest(workflow),source_manifest=digest(manifest),patch=digest(patch),event={k:os.environ.get(k) for k in ('GITHUB_REPOSITORY','GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_WORKFLOW_REF','RUNNER_ENVIRONMENT','RUNNER_OS','RUNNER_ARCH','ImageOS','ImageVersion')},environment={k:os.environ.get(k) for k in ('GOWORK','GOTOOLCHAIN','GOMAXPROCS','GOMEMLIMIT','GOFLAGS','GODEBUG','CGO_ENABLED')});save()
              ok,version=call('go-version',['go','version'],product,30);assert ok and 'go1.26.10 linux/amd64' in version
              ok,_=call('go-env',['go','env','-json','GOOS','GOARCH','CGO_ENABLED','GOWORK','GOTOOLCHAIN','GOFLAGS'],product,30);assert ok
              groups=[('1-TestCOWPhysicalCutCaptureAdmissionRefusal', 'TestCOWPhysicalCutCaptureAdmissionRefusal'), ('2-TestCOWPhysicalCutCaptureConcurrentCacheClose', 'TestCOWPhysicalCutCaptureConcurrentCacheClose'), ('3-TestCOWPhysicalCutCaptureKeepsFailedCleanup', 'TestCOWPhysicalCutCaptureKeepsFailedCleanup'), ('4-TestCOWPhysicalCutCaptureOutlivesRegistration', 'TestCOWPhysicalCutCaptureOutlivesRegistration'), ('5-TestCOWPhysicalCutCaptureNoRegistration', 'TestCOWPhysicalCutCaptureNoRegistration'), ('6-TestCOWPhysicalFrontierProbeAtCheckpointCapture', 'TestCOWPhysicalFrontierProbeAtCheckpointCapture'), ('7-TestCOWPhysicalFrontierProbeCancellationRetiresRegistration', 'TestCOWPhysicalFrontierProbeCancellationRetiresRegistration')]
              binary=p/'caching.test';args=['go','test','-c','-o',str(binary)]
              if cell=='linux-race':args.append('-race')
              args.append('./TreeDB/caching')
              built,_=call('caching-build',args,product,600)
              for label,test in groups:
                  group={'label':label,'expected_test':test,'build_pass':built};receipt['groups'].append(group);save()
                  if not built:continue
                  group['binary']=digest(binary.read_bytes());save()
                  passed,output=call(label+'-test',[str(binary),'-test.v','-test.count=1','-test.run=^'+test+'$','-test.timeout=9m'],product/'TreeDB/caching',570)
                  outcomes=re.findall(r'^--- (PASS|FAIL|SKIP): ([^ ]+)',output,re.M)
                  wanted=[test]
                  if test=='TestCOWPhysicalFrontierProbeAtCheckpointCapture':wanted += [test+'/joined',test+'/occupied_slot']
                  all_outcomes=re.findall(r'^\s*--- (PASS|FAIL|SKIP): ([^ ]+)',output,re.M)
                  group['outcomes']=all_outcomes;group['clean_pass']=passed and all_outcomes==[('PASS',name) for name in wanted] and 'DATA RACE' not in output
                  save()
              receipt['outcome']='FOCUSED_PASS_NOT_CAUSE_OR_REPAIR' if len(receipt['groups'])==7 and all(g.get('clean_pass') for g in receipt['groups']) else 'FAILED_OR_INCOMPLETE_DIAGNOSTIC'
              save()
              assert receipt['outcome']=='FOCUSED_PASS_NOT_CAUSE_OR_REPAIR'
          except BaseException:
              receipt.setdefault('outcome','FAILED_OR_INVALID_BINDING');receipt['failure']=traceback.format_exc();save();raise
          PY
      - name: Retain all focused evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-frontier-5338-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-frontier-5338-${{ matrix.cell }}
          if-no-files-found: error
          retention-days: 14
