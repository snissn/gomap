name: "TreeDB: vet+test"

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Vet
        working-directory: TreeDB
        run: go vet ./...

      - name: Test
        working-directory: TreeDB
        env:
          GOMEMLIMIT: 4GiB
          GOMAXPROCS: 2
        run: go test -p 1 ./...

  race:
    name: race-check (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Test Race
        working-directory: TreeDB
        run: GOMEMLIMIT=4GiB GOMAXPROCS=2 go test -race -p 1 ./...
