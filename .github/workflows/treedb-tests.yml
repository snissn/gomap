# PRIVATE FOCUSED CARRIER ONLY: do not merge; discovery manifest is intentionally stale.
name: "TreeDB: Snappy bound focused diagnostic"
on:
  workflow_dispatch:
    inputs:
      expected_overlay_sha:
        description: "Externally pinned reviewed carrier commit"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: snappy-bound-5345-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/5345-candidate-flags-hosted-20261031' && github.run_attempt == '1'
    name: Snappy bound (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cell: linux-normal
            race: '0'
          - cell: linux-race
            race: '1'
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOMEMLIMIT: 4GiB
      CELL: ${{ matrix.cell }}
      RACE: ${{ matrix.race }}
      EXPECTED_OVERLAY_SHA: ${{ inputs.expected_overlay_sha }}
      WORKFLOW_CONTEXT_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Initialize receipt
        shell: bash
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/snappy-bound-$CELL"
          printf 'cell=%s\nrun=%s\nattempt=%s\nref=%s\nworkflow=%s\nrunner=%s\n' "$CELL" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REF" "$WORKFLOW_CONTEXT_SHA" "$RUNNER_ENVIRONMENT" > "$RUNNER_TEMP/snappy-bound-$CELL/setup.txt"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = snissn/gomap
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$EXPECTED_OVERLAY_SHA" = "$WORKFLOW_CONTEXT_SHA"
          test "$EXPECTED_OVERLAY_SHA" = "$GITHUB_SHA"
      - name: Checkout exact reviewed carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact reviewed product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 405467fc4bc95dacd3233694af92473284550217
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Run bound tests and verify named completions
        shell: bash
        working-directory: product
        run: |
          set -eu
          receipt="$RUNNER_TEMP/snappy-bound-$CELL"
          git rev-parse HEAD > "$receipt/product-sha.txt"
          git rev-parse HEAD^{tree} > "$receipt/product-tree.txt"
          test "$(cat "$receipt/product-sha.txt")" = 405467fc4bc95dacd3233694af92473284550217
          test "$(cat "$receipt/product-tree.txt")" = 54dbc3f63f36eef7c752f7e8fd2da704471def35
          test -z "$(git status --porcelain --untracked-files=all --ignored)"
          test "$(git -C ../harness rev-parse HEAD)" = "$EXPECTED_OVERLAY_SHA"
          test -z "$(git -C ../harness status --porcelain --untracked-files=all --ignored)"
          git -C ../harness diff --name-only 405467fc4bc95dacd3233694af92473284550217 "$EXPECTED_OVERLAY_SHA" > "$receipt/carrier-diff.txt"
          test "$(cat "$receipt/carrier-diff.txt")" = '.github/workflows/treedb-tests.yml'
          cp ../harness/.github/workflows/treedb-tests.yml "$receipt/carrier.yml"
          sha256sum "$receipt/carrier.yml" > "$receipt/carrier-sha256.txt"
          go version > "$receipt/go-version.txt"
          go env GOOS GOARCH GOVERSION GOWORK GOTOOLCHAIN CGO_ENABLED > "$receipt/go-env.txt"
          test "$(go env GOVERSION)" = go1.26.10
          test "$(go env GOOS)" = linux
          test "$(go env GOARCH)" = amd64
          race_args=()
          if [ "$RACE" = 1 ]; then
            test "$(go env CGO_ENABLED)" = 1
            race_args=(-race)
          fi
          set +e
          timeout --signal=TERM --kill-after=10s 12m go test "${race_args[@]}" -count=1 -json ./TreeDB/internal/typedcolumn -run '^(TestFP32ImageEncodedUpperBound|TestFP32ImageEncodedUpperBoundAdmission|TestFP32ImageEncodedUpperBoundSnappy|TestFP32ImageEncodedUpperBoundSnappySections)$' > "$receipt/typedcolumn.jsonl" 2> "$receipt/typedcolumn.stderr"
          echo $? > "$receipt/typedcolumn.exit"
          timeout --signal=TERM --kill-after=10s 12m go test "${race_args[@]}" -count=1 -json ./TreeDB/collections -run '^(TestColumnPhysicalAssetEncodedUpperBoundSelectedProducer|TestOrdinaryFP32ImageBoundCoalescedSamples|TestOrdinaryFP32ImageBoundProductionSnappy)$' > "$receipt/collections.jsonl" 2> "$receipt/collections.stderr"
          echo $? > "$receipt/collections.exit"
          set -e
          sha256sum "$receipt/typedcolumn.jsonl" "$receipt/typedcolumn.stderr" "$receipt/collections.jsonl" "$receipt/collections.stderr" > "$receipt/log-sha256.txt"
          git status --porcelain --untracked-files=all --ignored > "$receipt/product-status-after.txt"
          python3 - "$receipt" <<'PY'
          import collections, json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          groups = {
              'typedcolumn': {'TestFP32ImageEncodedUpperBound', 'TestFP32ImageEncodedUpperBoundAdmission', 'TestFP32ImageEncodedUpperBoundSnappy', 'TestFP32ImageEncodedUpperBoundSnappySections'},
              'collections': {'TestColumnPhysicalAssetEncodedUpperBoundSelectedProducer', 'TestOrdinaryFP32ImageBoundCoalescedSamples', 'TestOrdinaryFP32ImageBoundProductionSnappy'},
          }
          problems = []
          for name, wanted in groups.items():
              if (p / (name + '.exit')).read_text().strip() != '0':
                  problems.append(name + ': nonzero test exit')
              events = [json.loads(line) for line in (p / (name + '.jsonl')).read_text().splitlines()]
              package = 'github.com/snissn/gomap/TreeDB/' + ('internal/typedcolumn' if name == 'typedcolumn' else 'collections')
              if any(e.get('Package') != package for e in events):
                  problems.append(name + ': unexpected package identity')
              passed = collections.Counter(e['Test'] for e in events if e.get('Action') == 'pass' and 'Test' in e and '/' not in e['Test'])
              if passed != collections.Counter({test: 1 for test in wanted}):
                  problems.append(name + ': unexpected top-level pass events ' + repr(dict(passed)))
              if any(e.get('Action') in ('fail', 'skip') for e in events):
                  problems.append(name + ': failure or skip event')
              if sum(e.get('Action') == 'pass' and 'Test' not in e for e in events) != 1:
                  problems.append(name + ': missing or duplicate package completion')
          if (p / 'product-status-after.txt').read_text():
              problems.append('product checkout changed')
          (p / 'verdict.json').write_text(json.dumps({'status': 'PASS' if not problems else 'FAIL', 'problems': problems}, indent=2) + '\n')
          if problems:
              raise SystemExit('; '.join(problems))
          PY
      - name: Upload retained receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snappy-bound-${{ matrix.cell }}
          path: ${{ runner.temp }}/snappy-bound-${{ matrix.cell }}
          if-no-files-found: error
          retention-days: 14
