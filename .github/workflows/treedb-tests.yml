# PRIVATE FOCUSED CARRIER ONLY: never merge; discovery inventory is intentionally stale.
name: "TreeDB: scalar forward original-owner focused diagnostic"
on:
  workflow_dispatch:
    inputs:
      expected_overlay_sha:
        description: Externally pinned reviewed private carrier SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scalar-forward-owner-5339-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/5339-owner-focused-hosted-20261031' && github.run_attempt == '1'
    name: Scalar forward owner (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cell: baseline-normal
            race: '0'
            product_sha: d2e6b07822807c2f0588103bcce8ce2a7dcf4ebd
            product_tree: 9ed9eb52ddb7211310fd0a959038af18ca0071f7
            test_regex: '^TestNativeScalarForwardOriginalCleanupAdmission$'
          - cell: candidate-normal
            race: '0'
            product_sha: 6c17640ced19fb5e91995070be28adea9d24b30e
            product_tree: a8cf099d940249762135791f150538947a24f1eb
            test_regex: '^TestNativeScalarForward'
          - cell: candidate-race
            race: '1'
            product_sha: 6c17640ced19fb5e91995070be28adea9d24b30e
            product_tree: a8cf099d940249762135791f150538947a24f1eb
            test_regex: '^TestNativeScalarForward'
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOMEMLIMIT: 4GiB
      CELL: ${{ matrix.cell }}
      RACE: ${{ matrix.race }}
      PRODUCT_SHA: ${{ matrix.product_sha }}
      PRODUCT_TREE: ${{ matrix.product_tree }}
      TEST_REGEX: ${{ matrix.test_regex }}
      EXPECTED_OVERLAY_SHA: ${{ inputs.expected_overlay_sha }}
      WORKFLOW_CONTEXT_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Initialize independent setup receipt
        shell: bash
        run: |
          set -eu
          receipt="$RUNNER_TEMP/scalar-forward-owner-$CELL"
          mkdir "$receipt"
          printf '{"status":"SETUP_INCOMPLETE","reason":"native command and verdict not yet completed"}\n' > "$receipt/verdict.json"
          printf 'cell=%s\nrun=%s\nattempt=%s\nref=%s\nevent=%s\nworkflow=%s\nrunner=%s\nproduct=%s\ntree=%s\n' "$CELL" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$WORKFLOW_CONTEXT_SHA" "$RUNNER_ENVIRONMENT" "$PRODUCT_SHA" "$PRODUCT_TREE" > "$receipt/setup.txt"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = snissn/gomap
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/codex/5339-owner-focused-hosted-20261031
          test "$EXPECTED_OVERLAY_SHA" = "$WORKFLOW_CONTEXT_SHA"
          test "$EXPECTED_OVERLAY_SHA" = "$GITHUB_SHA"
      - name: Checkout exact reviewed carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout literal matrix product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.product_sha }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Run and verify exact native owner events
        shell: bash
        working-directory: product
        run: |
          set -eu
          receipt="$RUNNER_TEMP/scalar-forward-owner-$CELL"
          trap 'step_status=$?; printf "%s\n" "$step_status" > "$receipt/execution-step.exit"' EXIT
          git rev-parse HEAD > "$receipt/product-sha.txt"
          git rev-parse HEAD^{tree} > "$receipt/product-tree.txt"
          test "$(cat "$receipt/product-sha.txt")" = "$PRODUCT_SHA"
          test "$(cat "$receipt/product-tree.txt")" = "$PRODUCT_TREE"
          git status --porcelain --untracked-files=all --ignored > "$receipt/product-status-before.txt"
          test ! -s "$receipt/product-status-before.txt"
          test "$(git -C ../harness rev-parse HEAD)" = "$EXPECTED_OVERLAY_SHA"
          test -z "$(git -C ../harness status --porcelain --untracked-files=all --ignored)"
          git -C ../harness diff --name-only 6c17640ced19fb5e91995070be28adea9d24b30e "$EXPECTED_OVERLAY_SHA" > "$receipt/carrier-diff.txt"
          test "$(cat "$receipt/carrier-diff.txt")" = '.github/workflows/treedb-tests.yml'
          git -C ../harness rev-parse HEAD HEAD^{tree} > "$receipt/carrier-source.txt"
          cp ../harness/.github/workflows/treedb-tests.yml "$receipt/carrier.yml"
          sha256sum "$receipt/carrier.yml" > "$receipt/carrier-sha256.txt"
          go version > "$receipt/go-version.txt"
          go tool compile -V > "$receipt/compiler.txt"
          command -v go > "$receipt/go-path.txt"
          go env -json GOOS GOARCH GOVERSION GOROOT GOTOOLDIR GOMOD GOWORK GOTOOLCHAIN CGO_ENABLED GOFLAGS GOEXPERIMENT GOAMD64 CC CXX CGO_CFLAGS CGO_CPPFLAGS CGO_CXXFLAGS CGO_LDFLAGS > "$receipt/go-env.json"
          printf 'GOWORK=%s\nGOTOOLCHAIN=%s\nGOMAXPROCS=%s\nGOMEMLIMIT=%s\nRACE=%s\n' "$GOWORK" "$GOTOOLCHAIN" "$GOMAXPROCS" "$GOMEMLIMIT" "$RACE" > "$receipt/environment.txt"
          test "$(go env GOVERSION)" = go1.26.10
          test "$(go env GOOS)" = linux
          test "$(go env GOARCH)" = amd64
          test "$(cat "$receipt/compiler.txt")" = 'compile version go1.26.10'
          race_args=()
          if [ "$RACE" = 1 ]; then
            test "$(go env CGO_ENABLED)" = 1
            race_args=(-race)
          fi
          command=(timeout --signal=TERM --kill-after=10s 16m go test "${race_args[@]}" -p=1 -count=1 -json -timeout=15m ./TreeDB/collections -run "$TEST_REGEX")
          python3 - "$receipt" "${command[@]}" <<'PY'
          import json, os, pathlib, sys, time
          p = pathlib.Path(sys.argv[1])
          (p / 'command.json').write_text(json.dumps({'argv': sys.argv[2:], 'cwd': os.getcwd(), 'started_unix_ns': time.time_ns()}, indent=2) + '\n')
          PY
          set +e
          "${command[@]}" > "$receipt/collections.jsonl" 2> "$receipt/collections.stderr"
          result=$?
          printf '%s\n' "$result" > "$receipt/collections.exit"
          set -e
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$receipt/command-finished-utc.txt"
          sha256sum "$receipt/collections.jsonl" "$receipt/collections.stderr" > "$receipt/log-sha256.txt"
          git status --porcelain --untracked-files=all --ignored > "$receipt/product-status-after.txt"
          python3 - "$receipt" "$CELL" <<'PY'
          import collections, json, pathlib, re, sys
          p, cell = pathlib.Path(sys.argv[1]), sys.argv[2]
          target = 'TestNativeScalarForwardOriginalCleanupAdmission'
          wanted = {
              'TestNativeScalarForwardConcurrentColdPublication',
              'TestNativeScalarForwardBorrowDuringSuccessorPublication',
              'TestNativeScalarForwardRangeAndWarmPredicateChange',
              'TestNativeScalarForwardPublicLifecycle',
              'TestNativeScalarForwardForegroundReadScope',
              'TestNativeScalarForwardPublicPhysicalReuse',
              'TestNativeScalarForwardOptionalRefusalAndBound',
              target,
              'TestNativeScalarForwardPublicSchemaAndPhysicalRefresh',
              'TestNativeScalarForwardOriginalAdmissionRefusal',
              'TestNativeScalarForwardHeldParentRefusal',
          }
          markers = ('constructed original-owner schedule:', 'original uncached admission:')
          oracle = 'uncached forward constructor bypassed original parent refusal'
          problems = []
          try:
              events = [json.loads(line) for line in (p / 'collections.jsonl').read_text().splitlines()]
          except json.JSONDecodeError as error:
              events = []
              problems.append('malformed native JSON: ' + str(error))
          raw = (p / 'collections.jsonl').read_text() + (p / 'collections.stderr').read_text()
          output = ''.join(e.get('Output', '') for e in events)
          package = 'github.com/snissn/gomap/TreeDB/collections'
          if any(e.get('Package') != package for e in events):
              problems.append('unexpected native package identity')
          if 'DATA RACE' in raw or re.search(r'panic:|fatal error:|test timed out|SIG(?:QUIT|TERM|KILL)', output + (p / 'collections.stderr').read_text()):
              problems.append('race, panic, fatal runtime error or termination witness')
          if any(e.get('Action') == 'skip' for e in events):
              problems.append('native skip event')
          def top(action):
              return collections.Counter(e['Test'] for e in events if e.get('Action') == action and 'Test' in e and '/' not in e['Test'])
          def package_count(action):
              return sum(e.get('Action') == action and 'Test' not in e for e in events)
          if cell == 'baseline-normal':
              if (p / 'collections.exit').read_text().strip() != '1':
                  problems.append('expected baseline test exit1')
              if top('run') != collections.Counter({target: 1}) or top('fail') != collections.Counter({target: 1}) or top('pass'):
                  problems.append('baseline must run and fail only the exact legacy oracle target')
              if package_count('fail') != 1 or package_count('pass') != 0:
                  problems.append('incorrect baseline package completion')
              if any('/' in e.get('Test', '') and e.get('Action') in ('run', 'pass', 'fail') for e in events):
                  problems.append('unexpected baseline subtest')
              lines = [line for e in events if e.get('Test') == target and e.get('Action') == 'output' for line in e.get('Output', '').splitlines()]
              for marker in (*markers, oracle):
                  if sum(marker in line for line in lines) != 1:
                      problems.append('missing/duplicate original ledger or exact oracle: ' + marker)
              positions = [next((i for i, line in enumerate(lines) if marker in line), -1) for marker in (*markers, oracle)]
              if not (0 <= positions[0] < positions[1] < positions[2]):
                  problems.append('ledger must precede original admission and legacy oracle')
              allowed = [r'=== RUN\s+' + target, r'--- FAIL: ' + target + r' \([0-9.]+s\)',
                         r'\S+\.go:\d+: ' + re.escape(markers[0]) + r'.*',
                         r'\S+\.go:\d+: ' + re.escape(markers[1]) + r'.*',
                         r'\S+\.go:\d+: ' + re.escape(oracle)]
              if any(line.strip() and not any(re.fullmatch(pattern, line.strip()) for pattern in allowed) for line in lines):
                  problems.append('unexpected baseline test output beyond the two ledger receipts and exact oracle')
              status = 'EXPECTED_RED'
          else:
              if (p / 'collections.exit').read_text().strip() != '0':
                  problems.append('nonzero candidate test exit')
              expected = collections.Counter({test: 1 for test in wanted})
              if top('run') != expected or top('pass') != expected:
                  problems.append('missing/duplicate/unexpected candidate top-level native run/pass events')
              if any(e.get('Action') == 'fail' for e in events) or package_count('pass') != 1:
                  problems.append('candidate failure or missing/duplicate package PASS')
              target_output = ''.join(e.get('Output', '') for e in events if e.get('Test') == target)
              if any(target_output.count(marker) != 1 for marker in markers) or oracle in output:
                  problems.append('candidate original-owner ledger missing/duplicate or legacy oracle remains')
              status = 'PASS'
          if (p / 'product-status-after.txt').read_text():
              problems.append('product checkout changed')
          (p / 'verdict.json').write_text(json.dumps({'status': 'FAIL' if problems else status, 'cell': cell,
              'problems': problems, 'top_run': dict(top('run')), 'top_pass': dict(top('pass')), 'top_fail': dict(top('fail'))}, indent=2) + '\n')
          if problems:
              raise SystemExit('; '.join(problems))
          PY
      - name: Upload retained setup and native receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scalar-forward-owner-${{ matrix.cell }}
          path: ${{ runner.temp }}/scalar-forward-owner-${{ matrix.cell }}
          if-no-files-found: error
          retention-days: 14
