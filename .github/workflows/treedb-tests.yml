name: "Recovery incidents 5318 and 5341 focused diagnostics"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-three-5318-5341-focused
  cancel-in-progress: false

jobs:
  focused:
    name: ${{ matrix.role }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: linux-normal
            runner: ubuntu-24.04
            race_flag: ''
          - role: linux-race
            runner: ubuntu-24.04
            race_flag: '-race'
          - role: windows-normal
            runner: windows-latest
            race_flag: ''
    env:
      GOWORK: 'off'
      GOMEMLIMIT: 4GiB
      GOMAXPROCS: '2'
      PRODUCT_SHA: 6e39ddd1abc39035c8553a345147c431d8fabb25
      PRODUCT_TREE: 2b630dded533ea339e9d24b63c3b09ed40df0bd6
      TEST_REGEX: '^Test(MetadataReuseCutDiagnostic(Cancellation|FailureObservations|ProcessTermination)4627|DurableRootMetadataReuse(ProcessCut|LowPlacementAndFallback|MultipageManifest)4627|DurableRootMetadataReuseRetainsBothSlotParents5135)$'
      CATALOG_REGEX: '^TestCatalogMetaBackupRestoresFreshThreeAuthorityClusterAndSurvivesReopenFailoverRejoin$'
      RACE_FLAG: ${{ matrix.race_flag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure literal checkout before fetching source
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          git config --global core.autocrlf false
          test "$(git config --global --get core.longpaths)" = true
          test "$(git config --global --get core.autocrlf)" = false

      - name: Checkout immutable product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6e39ddd1abc39035c8553a345147c431d8fabb25
          fetch-depth: 1
          persist-credentials: false

      - name: Retain controller and product identity
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_ENVIRONMENT_KIND: ${{ runner.environment }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          mkdir -p diagnostic-evidence
          {
            echo "controller_sha=$CONTROLLER_SHA workflow_sha=$WORKFLOW_SHA workflow_ref=$WORKFLOW_REF"
            echo "product_sha=$(git rev-parse HEAD) product_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "run_id=$RUN_ID attempt=$RUN_ATTEMPT role=$ROLE runner_environment=$RUNNER_ENVIRONMENT_KIND"
            echo "GOWORK=$GOWORK GOMEMLIMIT=$GOMEMLIMIT GOMAXPROCS=$GOMAXPROCS"
          } | tee diagnostic-evidence/identity.txt
          test "$(git config --get core.longpaths)" = true
          test "$(git config --get core.autocrlf)" = false
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Focused crash-cut and diagnostic controls once
        id: metadata
        run: |
          set -euo pipefail
          go version | tee diagnostic-evidence/go-version.txt
          echo "go test -json $RACE_FLAG -p 1 -count=1 -timeout=5m ./TreeDB/db -run '$TEST_REGEX'" | tee diagnostic-evidence/command.txt
          go test -json $RACE_FLAG -p 1 -count=1 -timeout=5m ./TreeDB/db -run "$TEST_REGEX" 2>&1 | tee diagnostic-evidence/test.log

      - name: Original catalog lifecycle once with phase receipts
        if: ${{ !cancelled() && steps.metadata.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          echo "go test -json $RACE_FLAG -p 1 -count=1 -timeout=5m ./TreeDB/internal/raftplacement -run '$CATALOG_REGEX'" | tee diagnostic-evidence/catalog-command.txt
          go test -json $RACE_FLAG -p 1 -count=1 -timeout=5m ./TreeDB/internal/raftplacement -run "$CATALOG_REGEX" 2>&1 | tee diagnostic-evidence/catalog-test.log

      - name: Retain original focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-incidents-focused-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-evidence/
          if-no-files-found: warn
          retention-days: 14
