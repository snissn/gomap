# Private baseline diagnostic only; do not merge. Discovery is intentionally stale.
name: "TreeDB: Snappy baseline RED diagnostic"
on:
  workflow_dispatch:
    inputs:
      expected_overlay_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: snappy-baseline-red-5345-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/5345-baseline-flags-hosted-20261030' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOMEMLIMIT: 4GiB
      EXPECTED_OVERLAY_SHA: ${{ inputs.expected_overlay_sha }}
      WORKFLOW_CONTEXT_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Initialize receipt
        shell: bash
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/snappy-baseline-red"
          printf 'run=%s\nattempt=%s\nref=%s\nworkflow=%s\nrunner=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REF" "$WORKFLOW_CONTEXT_SHA" "$RUNNER_ENVIRONMENT" > "$RUNNER_TEMP/snappy-baseline-red/setup.txt"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = snissn/gomap
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$EXPECTED_OVERLAY_SHA" = "$WORKFLOW_CONTEXT_SHA"
          test "$EXPECTED_OVERLAY_SHA" = "$GITHUB_SHA"
      - name: Checkout reviewed carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout baseline production plus test overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cfb18f2e452f9e1355f70049571dcaf2b7a069d7
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Capture exact baseline failures
        shell: bash
        working-directory: product
        run: |
          set -eu
          receipt="$RUNNER_TEMP/snappy-baseline-red"
          git rev-parse HEAD > "$receipt/product-sha.txt"
          git rev-parse HEAD^{tree} > "$receipt/product-tree.txt"
          test "$(cat "$receipt/product-sha.txt")" = cfb18f2e452f9e1355f70049571dcaf2b7a069d7
          test "$(cat "$receipt/product-tree.txt")" = 7e92b113fe634cb371258a2ce1f90685287a7a73
          test -z "$(git status --porcelain)"
          test "$(git -C ../harness rev-parse HEAD)" = "$EXPECTED_OVERLAY_SHA"
          test -z "$(git -C ../harness status --porcelain)"
          git -C ../harness diff --name-only cfb18f2e452f9e1355f70049571dcaf2b7a069d7 "$EXPECTED_OVERLAY_SHA" > "$receipt/carrier-diff.txt"
          test "$(cat "$receipt/carrier-diff.txt")" = '.github/workflows/treedb-tests.yml'
          git diff --name-only d7db5409e20412f4dac4e1a3f902484b05e014e1 HEAD > "$receipt/base-diff.txt"
          cp ../harness/.github/workflows/treedb-tests.yml "$receipt/carrier.yml"
          sha256sum "$receipt/carrier.yml" > "$receipt/carrier-sha256.txt"
          go version > "$receipt/go-version.txt"
          go env GOOS GOARCH GOVERSION GOWORK GOTOOLCHAIN CGO_ENABLED > "$receipt/go-env.txt"
          test "$(go env GOVERSION)" = go1.26.10
          test "$(go env GOOS)" = linux
          test "$(go env GOARCH)" = amd64
          set +e
          timeout --signal=TERM --kill-after=10s 12m go test -count=1 -json ./TreeDB/internal/typedcolumn -run '^(TestFP32ImageEncodedUpperBoundSnappy|TestFP32ImageEncodedUpperBoundSnappySections)$' > "$receipt/typedcolumn.jsonl" 2> "$receipt/typedcolumn.stderr"
          echo $? > "$receipt/typedcolumn.exit"
          timeout --signal=TERM --kill-after=10s 12m go test -count=1 -json ./TreeDB/collections -run '^TestOrdinaryFP32ImageBoundProductionSnappy$' > "$receipt/collections.jsonl" 2> "$receipt/collections.stderr"
          echo $? > "$receipt/collections.exit"
          set -e
          sha256sum "$receipt/typedcolumn.jsonl" "$receipt/typedcolumn.stderr" "$receipt/collections.jsonl" "$receipt/collections.stderr" > "$receipt/log-sha256.txt"
          git status --porcelain > "$receipt/product-status-after.txt"
          python3 - "$receipt" <<'PY'
          import collections, json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          groups = {
              'typedcolumn': {'TestFP32ImageEncodedUpperBoundSnappy', 'TestFP32ImageEncodedUpperBoundSnappySections'},
              'collections': {'TestOrdinaryFP32ImageBoundProductionSnappy'},
          }
          section_parent = 'TestFP32ImageEncodedUpperBoundSnappySections'
          sections = {section_parent + '/' + field for field in ('section', 'locator', 'dictionary', 'pruning')}
          problems = []
          for name, wanted in groups.items():
              if (p / (name + '.exit')).read_text().strip() != '1':
                  problems.append(name + ': expected test exit 1')
              events = [json.loads(line) for line in (p / (name + '.jsonl')).read_text().splitlines()]
              package = 'github.com/snissn/gomap/TreeDB/' + ('internal/typedcolumn' if name == 'typedcolumn' else 'collections')
              if any(e.get('Package') != package for e in events):
                  problems.append(name + ': unexpected package')
              failed = collections.Counter(e['Test'] for e in events if e.get('Action') == 'fail' and 'Test' in e and '/' not in e['Test'])
              if failed != collections.Counter({test: 1 for test in wanted}):
                  problems.append(name + ': incorrect top-level failures ' + repr(dict(failed)))
              expected_subtests = sections if name == 'typedcolumn' else set()
              failed_subtests = collections.Counter(e['Test'] for e in events if e.get('Action') == 'fail' and '/' in e.get('Test', ''))
              if failed_subtests != collections.Counter({test: 1 for test in expected_subtests}):
                  problems.append(name + ': incorrect subtest failures ' + repr(dict(failed_subtests)))
              if any(e.get('Action') in ('pass', 'skip') and 'Test' in e for e in events):
                  problems.append(name + ': unexpected test pass or skip')
              if sum(e.get('Action') == 'fail' and 'Test' not in e for e in events) != 1:
                  problems.append(name + ': missing or duplicate package failure')
              exact_failures = expected_subtests | (wanted - {section_parent})
              for test in exact_failures:
                  output = ''.join(e.get('Output', '') for e in events if e.get('Test') == test)
                  if 'typedcolumn: unsupported or overflowing FP32 image bound layout' not in output:
                      problems.append(name + ': missing expected unsupported layout error in ' + test)
                  if test in expected_subtests:
                      field = test.rsplit('/', 1)[1]
                      if 'Snappy ' + field + ' section rejected:' not in output:
                          problems.append('missing section-specific failure in ' + test)
          if (p / 'product-status-after.txt').read_text():
              problems.append('product checkout changed')
          (p / 'verdict.json').write_text(json.dumps({'status': 'EXPECTED_RED' if not problems else 'INCOMPLETE', 'problems': problems}, indent=2) + '\n')
          if problems:
              raise SystemExit('; '.join(problems))
          PY
      - name: Upload retained receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snappy-baseline-red
          path: ${{ runner.temp }}/snappy-baseline-red
          if-no-files-found: error
          retention-days: 14
