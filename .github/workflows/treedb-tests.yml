name: RabitQ 5313 failure-bound original Ubuntu shard (diagnostic only)
# Coordinator installs this reviewed file at the already-registered
# .github/workflows/treedb-tests.yml on an isolated dispatch branch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-ubuntu-shard-2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Initialize dispatch provenance before checkout
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/rabitq5313
          DISPATCH_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/capture" "$EVIDENCE/tmp"
          python3 - <<'PYTHON'
          import json, os, pathlib
          keys = ("DISPATCH_COMMIT", "WORKFLOW_REF", "WORKFLOW_SHA", "RUN_ID", "RUN_ATTEMPT")
          values = {key.lower(): os.environ[key] for key in keys}
          (pathlib.Path(os.environ["EVIDENCE"]) / "dispatch-provenance.json").write_text(json.dumps(values, indent=2) + "\n")
          PYTHON
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: dispatch
      - name: Bind the registered dispatch workflow
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/rabitq5313
          DISPATCH_COMMIT: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "$(git -C dispatch rev-parse HEAD)" = "$DISPATCH_COMMIT"
          # This is a direct workflow_dispatch, with no reusable workflow.
          test "$WORKFLOW_SHA" = "$DISPATCH_COMMIT"
          case "$WORKFLOW_REF" in
            snissn/gomap/.github/workflows/treedb-tests.yml@refs/heads/*) ;;
            *) printf '%s\n' "unexpected registered workflow ref: $WORKFLOW_REF" >&2; exit 1 ;;
          esac
          workflow_path=.github/workflows/treedb-tests.yml
          git -C dispatch show "$WORKFLOW_SHA:$workflow_path" > "$EVIDENCE/executed-workflow.yml"
          git -C dispatch rev-parse "$WORKFLOW_SHA:$workflow_path" > "$EVIDENCE/executed-workflow.blob.txt"
          sha256sum "$EVIDENCE/executed-workflow.yml" > "$EVIDENCE/executed-workflow.sha256.txt"
      - uses: actions/checkout@v4
        with:
          ref: 0a5b8a3d8a67287d4ccdeee29a7c75700e5d6052
          fetch-depth: 2
          path: probe
      - uses: actions/checkout@v4
        with:
          ref: 4238ac962aa4b4eb5d3c744426f2bd57d501c872
          path: source
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - name: Bind exact source and test-only overlay
        shell: bash
        env:
          PROBE_COMMIT: 0a5b8a3d8a67287d4ccdeee29a7c75700e5d6052
          EVIDENCE: ${{ runner.temp }}/rabitq5313
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/capture" "$EVIDENCE/tmp"
          test "$PROBE_COMMIT" = 0a5b8a3d8a67287d4ccdeee29a7c75700e5d6052
          test "$(git -C probe rev-parse HEAD)" = "$PROBE_COMMIT"
          test "$(git -C probe rev-parse HEAD^)" = a7abcb421088933be66c8583bbed402f4217e63d
          test "$(git -C source rev-parse HEAD)" = 4238ac962aa4b4eb5d3c744426f2bd57d501c872
          target=TreeDB/collections/column_vector_graph_rabitq_quantized_asset_test.go
          helper=TreeDB/collections/rabitq_failure_capture_test.go
          printf '%s\n' "$target" "$helper" > "$EVIDENCE/expected-paths.txt"
          git -C probe diff --name-only HEAD^ HEAD > "$EVIDENCE/overlay-paths.txt"
          diff -u "$EVIDENCE/expected-paths.txt" "$EVIDENCE/overlay-paths.txt"
          test "$(git -C source rev-parse HEAD:"$target")" = 9a5448774b8232e0210da158994bfd7e6045e6d1
          test "$(git -C probe rev-parse HEAD^:"$target")" = 9a5448774b8232e0210da158994bfd7e6045e6d1
          test ! -e "source/$helper"
          git -C probe diff --binary --full-index HEAD^ HEAD > "$EVIDENCE/overlay.patch"
          git -C source apply --check "$EVIDENCE/overlay.patch"
          git -C source apply "$EVIDENCE/overlay.patch"
          for file in "$target" "$helper"; do
            test "$(git -C source hash-object "$file")" = "$(git -C probe rev-parse HEAD:"$file")"
          done
          {
            printf 'original_failed_source=%s\nprobe_commit=%s\nprobe_base=%s\n' 4238ac962aa4b4eb5d3c744426f2bd57d501c872 "$PROBE_COMMIT" a7abcb421088933be66c8583bbed402f4217e63d
            printf 'runner_os=%s\nrunner_arch=%s\nimage_os=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -a
            lscpu
          } > "$EVIDENCE/provenance.txt"
          git -C source diff --binary --full-index > "$EVIDENCE/applied-tracked.patch"
          git -C source status --porcelain > "$EVIDENCE/applied-status.txt"
          sha256sum "$EVIDENCE/overlay.patch" source/.github/workflows/treedb-tests.yml source/.github/ci/treedb_unix_weighted_shards.tsv >> "$EVIDENCE/provenance.txt"
          # Original source/probe identities above are independent of dispatch identity.
          # executed-workflow.* and dispatch-provenance.json bind the actual workflow.
      - name: Run original full Ubuntu shard once
        working-directory: source/TreeDB
        timeout-minutes: 25
        shell: bash
        env:
          GOMEMLIMIT: 4GiB
          GOMAXPROCS: 2
          TMPDIR: ${{ runner.temp }}/rabitq5313/tmp
          EVIDENCE: ${{ runner.temp }}/rabitq5313
          TREEDB_RABITQ_FAILURE_CAPTURE: ${{ runner.temp }}/rabitq5313/capture
        run: |
          set -euo pipefail
          # Capture in the same working directory and step environment as go test.
          pwd > "$EVIDENCE/effective-build-working-directory.txt"
          go version > "$EVIDENCE/effective-go-version.txt"
          go tool compile -V > "$EVIDENCE/effective-compiler-version.txt"
          go env -json GOVERSION GOROOT GOOS GOARCH GOAMD64 CGO_ENABLED GOTOOLCHAIN GOTOOLDIR GOFLAGS GOEXPERIMENT GOWORK GOMOD GOENV GODEBUG CC CXX CGO_CFLAGS CGO_CPPFLAGS CGO_CXXFLAGS CGO_FFLAGS CGO_LDFLAGS PKG_CONFIG GOPATH GOCACHE GOMODCACHE > "$EVIDENCE/effective-go-env.json"
          python3 - <<'PYTHON'
          import json, os, pathlib
          keys = ("GOFLAGS", "GOEXPERIMENT", "GOWORK", "GOMOD", "GOENV", "GODEBUG", "GOGC", "GOMEMLIMIT", "GOMAXPROCS", "GOROOT", "GOTOOLCHAIN", "TMPDIR", "TREEDB_RABITQ_FAILURE_CAPTURE")
          # null means unset, preserving the distinction from an explicit empty value.
          values = {key: os.environ.get(key) for key in keys}
          (pathlib.Path(os.environ["EVIDENCE"]) / "effective-process-env.json").write_text(json.dumps(values, indent=2) + "\n")
          PYTHON
          sha256sum ../go.mod ../go.sum > "$EVIDENCE/effective-module-files.sha256.txt"
          weighted_shard_file() {
            kind="$1"
            shard_index="$2"
            shard_count="$3"
            weights_file="$4"
            all_file="$5"
            shard_file="$6"
            awk -F '\t' -v kind="$kind" -v idx="$shard_index" -v n="$shard_count" '
              NR == FNR {
                if ($0 !~ /^#/ && NF >= 3 && $1 == kind) {
                  pinned[$3] = $2
                  preserve_fallback[$3] = ($5 == "preserve-fallback")
                }
                next
              }
              $0 in pinned {
                if ((pinned[$0] + 0) == idx) print
                if (preserve_fallback[$0]) fallback++
                next
              }
              (fallback % n) == idx { print }
              { fallback++ }
            ' "$weights_file" "$all_file" > "$shard_file"
          }
          package_all_file="$EVIDENCE/all-packages.txt"
          package_file="$EVIDENCE/selected-packages.txt"
          go list ./... > "$package_all_file"
          weighted_shard_file package 1 3 ../.github/ci/treedb_unix_weighted_shards.tsv "$package_all_file" "$package_file"
          test -s "$package_file"
          grep -Fx github.com/snissn/gomap/TreeDB/collections "$package_file"
          cat "$package_file"
          printf '%s\n' 'xargs go test -json -timeout 30m -p 1 < selected-packages.txt 2> treedb-test.stderr | tee treedb-test.jsonl' 'GOMEMLIMIT=4GiB GOMAXPROCS=2' 'stdout and stderr files are written directly under EVIDENCE' > "$EVIDENCE/command.txt"
          set +e
          xargs go test -json -timeout 30m -p 1 < "$package_file" 2> "$EVIDENCE/treedb-test.stderr" | tee "$EVIDENCE/treedb-test.jsonl"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'xargs=%s tee=%s\n' "${statuses[0]}" "${statuses[1]}" > "$EVIDENCE/exit-status.txt"
          test "${statuses[0]}" -eq 0
          test "${statuses[1]}" -eq 0
      # always() is best effort: runner loss, hard job timeout, cancellation, or
      # upload failure can prevent inventory/upload. Missing artifacts are incomplete
      # evidence, never a pass or an allocation-free result.
      - name: Inventory diagnostic artifacts
        if: always()
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/rabitq5313
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          for binary in "$EVIDENCE"/capture/*/collections.test; do
            if [ -f "$binary" ]; then
              go version -m "$binary" > "$binary.buildinfo.txt"
              go tool buildid "$binary" > "$binary.buildid.txt"
            fi
          done
          cd "$EVIDENCE"
          find . -type f ! -path './tmp/*' ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rabitq5313-original-ubuntu-shard-failure-bound
          path: |
            ${{ runner.temp }}/rabitq5313
            !${{ runner.temp }}/rabitq5313/tmp
          if-no-files-found: error
