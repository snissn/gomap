# Private paired diagnostic carrier only; never merge this workflow overlay.
name: "TreeDB: paired public graph cost diagnostic"
on:
  workflow_dispatch:
    inputs:
      expected_overlay_sha:
        description: Independently reviewed exact carrier commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: snappy-public-pair-5345-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/5345-paired-public-hosted-20261031' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    # Prior setup steps are capped at 21m; the paired step is capped at 145m
    # (two 15m revision-build budgets + ten 9m helper/public samples + binding/quiet checks), upload 10m.
    timeout-minutes: 180
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      EXPECTED_OVERLAY_SHA: ${{ inputs.expected_overlay_sha }}
      WORKFLOW_CONTEXT_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Initialize diagnostic evidence
        timeout-minutes: 1
        shell: bash
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/snappy-public-pair-receipt"
          printf 'run=%s\nattempt=%s\nref=%s\nevent=%s\nworkflow=%s\nrunner=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$WORKFLOW_CONTEXT_SHA" "$RUNNER_ENVIRONMENT" > "$RUNNER_TEMP/snappy-public-pair-receipt/setup.txt"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = snissn/gomap
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/codex/5345-paired-public-hosted-20261031
          test "$EXPECTED_OVERLAY_SHA" = "$WORKFLOW_CONTEXT_SHA"
          test "$EXPECTED_OVERLAY_SHA" = "$GITHUB_SHA"
      - name: Checkout reviewed diagnostic harness
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact baseline benchmark product
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c40008ded241677f584dc610dfabdb08d628946a
          path: baseline
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact candidate benchmark product
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 405467fc4bc95dacd3233694af92473284550217
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Go toolchain
        timeout-minutes: 5
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Bind source and run bounded paired diagnostic
        timeout-minutes: 145
        shell: bash
        run: |
          set -eu
          receipt="$RUNNER_TEMP/snappy-public-pair-receipt"
          test "$(git -C harness rev-parse HEAD)" = "$EXPECTED_OVERLAY_SHA"
          test -z "$(git -C harness status --porcelain --untracked-files=all --ignored)"
          test "$(git -C baseline rev-parse HEAD)" = c40008ded241677f584dc610dfabdb08d628946a
          test "$(git -C baseline rev-parse HEAD^{tree})" = a21123d25a31a958304d4ef4ca036d7b6cb486d3
          test "$(git -C candidate rev-parse HEAD)" = 405467fc4bc95dacd3233694af92473284550217
          test "$(git -C candidate rev-parse HEAD^{tree})" = 54dbc3f63f36eef7c752f7e8fd2da704471def35
          git -C harness diff --name-only 405467fc4bc95dacd3233694af92473284550217 "$EXPECTED_OVERLAY_SHA" > "$receipt/carrier-diff.txt"
          python3 - "$receipt/carrier-diff.txt" <<'PY'
          import pathlib, sys
          actual = pathlib.Path(sys.argv[1]).read_text().splitlines()
          expected = ['.github/scripts/ci_5345_public_pair.py', '.github/workflows/treedb-tests.yml']
          if actual != expected:
              raise SystemExit('unexpected private carrier source delta: ' + repr(actual))
          PY
          cp harness/.github/workflows/treedb-tests.yml "$receipt/carrier.yml"
          cp harness/.github/scripts/ci_5345_public_pair.py "$receipt/runner.py"
          sha256sum "$receipt/carrier.yml" "$receipt/runner.py" > "$receipt/harness-sha256.txt"
          git -C harness rev-parse HEAD HEAD^{tree} > "$receipt/carrier-source.txt"
          go version > "$receipt/go-version.txt"
          go env GOOS GOARCH GOVERSION GOWORK GOTOOLCHAIN > "$receipt/go-env.txt"
          test "$(go env GOVERSION)" = go1.26.10
          test "$(go env GOOS)" = linux
          test "$(go env GOARCH)" = amd64
          set +e
          python3 harness/.github/scripts/ci_5345_public_pair.py "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/snappy-public-pair-output" > "$receipt/runner.log" 2>&1
          result=$?
          printf '%s\n' "$result" > "$receipt/runner.exit"
          sha256sum "$receipt/runner.log" > "$receipt/runner-log-sha256.txt"
          exit "$result"
      - name: Upload retained diagnostic evidence
        timeout-minutes: 10
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snappy-public-pair-diagnostic
          path: |
            ${{ runner.temp }}/snappy-public-pair-receipt
            ${{ runner.temp }}/snappy-public-pair-output
          if-no-files-found: error
          retention-days: 14
