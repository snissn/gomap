name: "TreeDB: vet+test"

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
            timeout: 15
            shard_kind: all
          - name: macos-latest
            os: macos-latest
            timeout: 15
            shard_kind: all
          - name: windows-core-1
            os: windows-latest
            timeout: 25
            shard_kind: windows-core
            package_shard_index: 0
            package_shard_count: 2
          - name: windows-core-2
            os: windows-latest
            timeout: 25
            shard_kind: windows-core
            package_shard_index: 1
            package_shard_count: 2
          - name: windows-caching-heavy-1
            os: windows-latest
            timeout: 25
            shard_kind: windows-caching-heavy
            heavy_shard_index: 0
            heavy_shard_count: 2
          - name: windows-caching-heavy-2
            os: windows-latest
            timeout: 25
            shard_kind: windows-caching-heavy
            heavy_shard_index: 1
            heavy_shard_count: 2
          - name: windows-caching-rest-1
            os: windows-latest
            timeout: 25
            shard_kind: windows-caching-rest
            rest_shard_index: 0
            rest_shard_count: 3
          - name: windows-caching-rest-2
            os: windows-latest
            timeout: 25
            shard_kind: windows-caching-rest
            rest_shard_index: 1
            rest_shard_count: 3
          - name: windows-caching-rest-3
            os: windows-latest
            timeout: 25
            shard_kind: windows-caching-rest
            rest_shard_index: 2
            rest_shard_count: 3
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: |
            go.sum

      - name: Vet
        if: ${{ matrix.shard_kind != 'windows-caching-heavy' && matrix.shard_kind != 'windows-caching-rest' }}
        working-directory: TreeDB
        run: go vet ./...

      - name: Test
        working-directory: TreeDB
        shell: bash
        env:
          GOMEMLIMIT: 4GiB
          GOMAXPROCS: 2
        run: |
          set -o pipefail
          case "${{ matrix.shard_kind }}" in
            all)
              go test -json -timeout 30m -p 1 ./... | tee treedb-test.jsonl
              ;;
            windows-core)
              package_shard_index="${{ matrix.package_shard_index }}"
              package_shard_count="${{ matrix.package_shard_count }}"
              if [ -z "$package_shard_index" ]; then
                package_shard_index=0
              fi
              if [ -z "$package_shard_count" ] || [ "$package_shard_count" -lt 1 ]; then
                package_shard_count=1
              fi
              package_file="$(mktemp)"
              db_test_file="$(mktemp)"
              go list ./... | grep -v '^github.com/snissn/gomap/TreeDB/caching$' | grep -v '^github.com/snissn/gomap/TreeDB/db$' | awk -v idx="$package_shard_index" -v n="$package_shard_count" 'BEGIN { c = 0 } { if ((c % n) == idx) print; c++ }' > "$package_file"
              go test ./db -list 'Test.*' | tr -d '\r' | grep '^Test' | awk -v idx="$package_shard_index" -v n="$package_shard_count" 'BEGIN { c = 0 } { if ((c % n) == idx) print; c++ }' > "$db_test_file"
              echo "TreeDB windows-core package shard=${package_shard_index}/${package_shard_count}"
              xargs go test -json -timeout 30m -p 1 < "$package_file" | tee treedb-test.jsonl
              if [ -s "$db_test_file" ]; then
                db_regex="^($(paste -sd'|' "$db_test_file"))$"
                echo "TreeDB/db test shard=${package_shard_index}/${package_shard_count} regex=${db_regex}"
                go test -json -timeout 30m -p 1 ./db -run "$db_regex" | tee -a treedb-test.jsonl
              fi
              rm -f "$package_file" "$db_test_file"
              ;;
            windows-caching-heavy)
              heavy_file="$(mktemp)"
              heavy_shard_file="$(mktemp)"
              tr -d '\r' < ../.github/ci/treedb_windows_caching_heavy_tests.txt | grep -v '^#' | sed '/^$/d' > "$heavy_file"
              heavy_shard_index="${{ matrix.heavy_shard_index }}"
              heavy_shard_count="${{ matrix.heavy_shard_count }}"
              if [ -z "$heavy_shard_index" ]; then
                heavy_shard_index=0
              fi
              if [ -z "$heavy_shard_count" ] || [ "$heavy_shard_count" -lt 1 ]; then
                heavy_shard_count=1
              fi
              awk -v idx="$heavy_shard_index" -v n="$heavy_shard_count" 'BEGIN { c = 0 } { if ((c % n) == idx) print; c++ }' "$heavy_file" > "$heavy_shard_file"
              if ! [ -s "$heavy_shard_file" ]; then
                echo "no heavy caching tests found for shard ${heavy_shard_index}/${heavy_shard_count}; skipping"
                printf '{"Time":"%s","Action":"skip","Package":"github.com/snissn/gomap/TreeDB/caching"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > treedb-test.jsonl
                rm -f "$heavy_file" "$heavy_shard_file"
                exit 0
              fi
              regex="^($(paste -sd'|' "$heavy_shard_file"))$"
              echo "TreeDB/caching heavy shard=${heavy_shard_index}/${heavy_shard_count} regex=${regex}"
              go test -json -timeout 30m -p 1 ./caching -run "$regex" | tee treedb-test.jsonl
              rm -f "$heavy_file" "$heavy_shard_file"
              ;;
            windows-caching-rest)
              heavy_file="$(mktemp)"
              rest_file="$(mktemp)"
              rest_shard_file="$(mktemp)"
              tr -d '\r' < ../.github/ci/treedb_windows_caching_heavy_tests.txt | grep -v '^#' | sed '/^$/d' > "$heavy_file"
              go test ./caching -list 'Test.*' | tr -d '\r' | grep '^Test' | grep -F -x -v -f "$heavy_file" > "$rest_file"
              rest_shard_index="${{ matrix.rest_shard_index }}"
              rest_shard_count="${{ matrix.rest_shard_count }}"
              if [ -z "$rest_shard_index" ]; then
                rest_shard_index=0
              fi
              if [ -z "$rest_shard_count" ] || [ "$rest_shard_count" -lt 1 ]; then
                rest_shard_count=1
              fi
              awk -v idx="$rest_shard_index" -v n="$rest_shard_count" 'BEGIN { c = 0 } { if ((c % n) == idx) print; c++ }' "$rest_file" > "$rest_shard_file"
              rest_regex="^($(paste -sd'|' "$rest_shard_file"))$"
              if [ "$rest_regex" = '^()$' ]; then
                echo "no non-heavy caching tests found for shard ${rest_shard_index}/${rest_shard_count}; skipping"
                printf '{"Time":"%s","Action":"skip","Package":"github.com/snissn/gomap/TreeDB/caching"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > treedb-test.jsonl
                rm -f "$heavy_file" "$rest_file" "$rest_shard_file"
                exit 0
              fi
              echo "TreeDB/caching rest shard=${rest_shard_index}/${rest_shard_count} regex=${rest_regex}"
              go test -json -timeout 30m -p 1 ./caching -run "$rest_regex" | tee treedb-test.jsonl
              rm -f "$heavy_file" "$rest_file" "$rest_shard_file"
              ;;
            *)
              echo "unknown shard kind: ${{ matrix.shard_kind }}" >&2
              exit 1
              ;;
          esac

      - name: Summarize test timings
        if: always()
        working-directory: TreeDB
        shell: bash
        run: |
          python ../.github/scripts/summarize_go_test_json.py treedb-test.jsonl | tee treedb-test-summary.md
          {
            echo "### TreeDB test timing summary (${{ matrix.name }})"
            echo
            cat treedb-test-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treedb-test-json-${{ matrix.name }}
          path: |
            TreeDB/treedb-test.jsonl
            TreeDB/treedb-test.jsonl.summary.md

  race:
    name: race-check (linux)-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            shard_index: 0
            shard_count: 2
          - shard: 2
            shard_index: 1
            shard_count: 2
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Test Race
        working-directory: TreeDB
        shell: bash
        run: |
          set -o pipefail
          shard_index="${{ matrix.shard_index }}"
          shard_count="${{ matrix.shard_count }}"
          package_file="$(mktemp)"
          db_test_file="$(mktemp)"
          go list ./... | grep -v '^github.com/snissn/gomap/TreeDB/db$' | awk -v idx="$shard_index" -v n="$shard_count" 'BEGIN { c = 0 } { if ((c % n) == idx) print; c++ }' > "$package_file"
          go test ./db -list 'Test.*' | grep '^Test' | awk -v idx="$shard_index" -v n="$shard_count" 'BEGIN { c = 0 } { if ((c % n) == idx) print; c++ }' > "$db_test_file"
          if ! [ -s "$package_file" ]; then
            echo "no packages found for race shard ${shard_index}/${shard_count}; skipping"
            printf '{"Time":"%s","Action":"skip","Package":"github.com/snissn/gomap/TreeDB"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > treedb-race.jsonl
            rm -f "$package_file" "$db_test_file"
            exit 0
          fi
          echo "TreeDB race package shard=${shard_index}/${shard_count}"
          cat "$package_file"
          GOMEMLIMIT=4GiB GOMAXPROCS=2 xargs go test -json -race -p 1 < "$package_file" | tee treedb-race.jsonl
          if [ -s "$db_test_file" ]; then
            db_regex="^($(paste -sd'|' "$db_test_file"))$"
            echo "TreeDB/db race test shard=${shard_index}/${shard_count} regex=${db_regex}"
            GOMEMLIMIT=4GiB GOMAXPROCS=2 go test -json -race -p 1 ./db -run "$db_regex" | tee -a treedb-race.jsonl
          fi
          rm -f "$package_file" "$db_test_file"

      - name: Summarize race timing
        if: always()
        working-directory: TreeDB
        shell: bash
        run: |
          python ../.github/scripts/summarize_go_test_json.py treedb-race.jsonl | tee treedb-race-summary.md
          {
            echo "### TreeDB race timing summary"
            echo
            cat treedb-race-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload race timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treedb-race-json-linux-${{ matrix.shard }}
          path: |
            TreeDB/treedb-race.jsonl
            TreeDB/treedb-race.jsonl.summary.md

  perf:
    name: perf-smoke (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: ValueLog dict compressibility bench
        run: |
          go test ./TreeDB/internal/valuelog -run '^$' \
            -bench 'BenchmarkValueLogDictCompressibilitySweep/valsize=1024/(highly_compressible_tail64|medium_compressible|incompressible)/dict_(off|on)/k=4$' \
            -benchmem -count=5 | tee vlog_dict_bench.txt

      - name: Perf baseline checker (gate)
        run: |
          go run .github/scripts/check_vlog_dict_bench.go \
            -bench-output vlog_dict_bench.txt \
            -baseline .github/perf_baselines/vlog_dict_defaults.json \
            -strict=true

      - name: Incompressible auto-vs-off gate
        run: |
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            off_log="vlog_auto_incompressible_off_attempt${attempt}.txt"
            auto_log="vlog_auto_incompressible_auto_attempt${attempt}.txt"
            echo "incompressible gate attempt ${attempt}/${max_attempts}"

            if ! go run ./cmd/unified_bench \
              -keys 1000000 \
              -valsize 512 \
              -batchsize 1024 \
              -dbs treedb_vlog_off \
              -test batch_write \
              -val-pattern random \
              -format markdown \
              -progress=false \
              -keep=false \
              -seed 1 \
              -treedb-force-value-pointers=true \
              -treedb-value-log-threshold=1 \
              -treedb-vlog-dict-train-bytes=-1 \
              > "${off_log}" 2>&1; then
              echo "treedb_vlog_off benchmark failed on attempt ${attempt}"
              tail -n 80 "${off_log}" || true
              continue
            fi

            if ! go run ./cmd/unified_bench \
              -keys 1000000 \
              -valsize 512 \
              -batchsize 1024 \
              -dbs treedb_vlog_auto \
              -test batch_write \
              -val-pattern random \
              -format markdown \
              -progress=false \
              -keep=false \
              -seed 1 \
              -treedb-force-value-pointers=true \
              -treedb-value-log-threshold=1 \
              -treedb-vlog-dict-train-bytes=-1 \
              > "${auto_log}" 2>&1; then
              echo "treedb_vlog_auto benchmark failed on attempt ${attempt}"
              tail -n 80 "${auto_log}" || true
              continue
            fi

            if go run .github/scripts/check_vlog_auto_incompressible.go \
              -off-log "${off_log}" \
              -auto-log "${auto_log}" \
              -min-throughput-frac 0.95 \
              -max-size-frac 1.02; then
              exit 0
            fi

            echo "incompressible gate threshold check failed on attempt ${attempt}"
            tail -n 80 "${off_log}" || true
            tail -n 80 "${auto_log}" || true
          done

          echo "incompressible auto-vs-off gate failed after ${max_attempts} attempts"
          exit 1
