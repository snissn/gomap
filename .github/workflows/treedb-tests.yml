# Staging-only replacement of an existing dispatchable path. Never merge.
name: "TreeDB: #5340 Windows provenance diagnostic"

on:
  workflow_dispatch:
    inputs:
      expected_overlay_sha:
        description: "Externally reviewed immutable H SHA; preflight must bind this value"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recovery-ledger-5340-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"
  GOMAXPROCS: "2"
  GOMEMLIMIT: "4GiB"
  PYTHONDONTWRITEBYTECODE: "1"
  EXPECTED_OVERLAY_SHA: ${{ inputs.expected_overlay_sha }}

jobs:
  controls:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prepared/5340-hosted-ledger-20261030' && github.run_attempt == '1' && github.sha == inputs.expected_overlay_sha && github.workflow_sha == inputs.expected_overlay_sha
    name: recovery ledger (${{ matrix.cell }}-controls)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cell: windows-normal
            os: windows-latest
            race: "0"
    steps:
      - name: Enable existing tracked long paths on hosted Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          test "$(git config --global --get core.longpaths)" = "true"
          git config --global core.autocrlf false
          test "$(git config --global --get core.autocrlf)" = "false"
      - name: Checkout exact event harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout fixed reviewed product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bd614f5701b16bcb16f11c4e52806626aa6bbd4c
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Setup retained parent Go 1.26.10
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: false
      - name: Retain source, binary and original process outcomes
        env:
          LEDGER_CELL: ${{ matrix.cell }}
          LEDGER_RACE: ${{ matrix.race }}
          LEDGER_MODE: controls
          LEDGER_INPUTS: ${{ runner.temp }}/recovery-ledger-inputs
          LEDGER_INPUT_ARTIFACT: recovery-ledger-5340-${{ matrix.cell }}-controls-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -u harness/.github/scripts/recovery_ledger_5340_hosted.py
      - name: Upload complete packet including failure
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-ledger-5340-${{ matrix.cell }}-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-ledger-5340-${{ matrix.cell }}-controls/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Record upload identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          printf '%s\n' "upload_outcome=$UPLOAD_OUTCOME" "artifact_id=$ARTIFACT_ID" "artifact_digest=$ARTIFACT_DIGEST" "artifact_url=$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  observation:
    needs: controls
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prepared/5340-hosted-ledger-20261030' && github.run_attempt == '1' && github.sha == inputs.expected_overlay_sha && github.workflow_sha == inputs.expected_overlay_sha }}
    name: recovery ledger (${{ matrix.cell }}-${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cell: windows-normal
            os: windows-latest
            race: "0"
            mode: default
          - cell: windows-normal
            os: windows-latest
            race: "0"
            mode: diagnostic
    steps:
      - name: Enable existing tracked long paths on hosted Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          test "$(git config --global --get core.longpaths)" = "true"
          git config --global core.autocrlf false
          test "$(git config --global --get core.autocrlf)" = "false"
      - name: Checkout exact event harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout fixed reviewed product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bd614f5701b16bcb16f11c4e52806626aa6bbd4c
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Setup retained parent Go 1.26.10
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: false
      - name: Download original controls and retained binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recovery-ledger-5340-${{ matrix.cell }}-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-ledger-inputs
      - name: Retain source, binary and original process outcomes
        env:
          LEDGER_CELL: ${{ matrix.cell }}
          LEDGER_RACE: ${{ matrix.race }}
          LEDGER_MODE: ${{ matrix.mode }}
          LEDGER_INPUTS: ${{ runner.temp }}/recovery-ledger-inputs
          LEDGER_INPUT_ARTIFACT: recovery-ledger-5340-${{ matrix.cell }}-controls-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -u harness/.github/scripts/recovery_ledger_5340_hosted.py
      - name: Upload complete packet including failure
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-ledger-5340-${{ matrix.cell }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-ledger-5340-${{ matrix.cell }}-${{ matrix.mode }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Record upload identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          printf '%s\n' "upload_outcome=$UPLOAD_OUTCOME" "artifact_id=$ARTIFACT_ID" "artifact_digest=$ARTIFACT_DIGEST" "artifact_url=$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
