# Branch-only diagnostic prototype. Never merge this replacement workflow.
# No production writes, retry, merge gate or qualification result is selected.
name: "DIAGNOSTIC ONLY: isolated RabitQ allocation capture"

on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: "Acknowledge one nonqualifying observation; original CI failure remains unresolved"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: rabitq-single-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/rabitq-single-hosted-diagnostic' && inputs.diagnostic_only }}
    name: "DIAGNOSTIC ONLY — one isolated child, no qualification"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 4GiB
      GOWORK: "off"
      GOTOOLCHAIN: local
      ORIGINAL_MERGE: 4238ac962aa4b4eb5d3c744426f2bd57d501c872
      PROBE_SOURCE: 02b58d31280cb0825db625f79384ac5cc8e68449
      EXPECTED_PATCH_SHA256: 477f0a3ddf7a20654be7567fe8a69fa7b7ecc285c532071efaeacb65d5c34604
    steps:
      - name: Reject retry and record diagnostic scope
        shell: bash
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$RUN_ATTEMPT" = 1
          mkdir -p "$RUNNER_TEMP/rabitq-evidence" "$RUNNER_TEMP/rabitq-tmp"
          echo "DIAGNOSTIC ONLY; no qualification, waiver, tolerance, retry or production change" > "$RUNNER_TEMP/rabitq-evidence/SCOPE.txt"
          echo "TMPDIR=$RUNNER_TEMP/rabitq-tmp" >> "$GITHUB_ENV"
          echo "TREEDB_RABITQ_DIAGNOSTIC_DIR=$RUNNER_TEMP/rabitq-evidence/raw" >> "$GITHUB_ENV"

      - name: Checkout original failed synthetic merge
        uses: actions/checkout@v4
        with:
          ref: 4238ac962aa4b4eb5d3c744426f2bd57d501c872
          path: workload
          persist-credentials: false

      - name: Checkout independently reviewed diagnostic source
        uses: actions/checkout@v4
        with:
          ref: 02b58d31280cb0825db625f79384ac5cc8e68449
          path: probe-source
          persist-credentials: false

      - name: Setup exact original Go patch version
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: false

      - name: Bind source and verify only reviewed test instrumentation
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rabitq-evidence"
          test "$(git -C workload rev-parse HEAD)" = "$ORIGINAL_MERGE"
          test "$(git -C probe-source rev-parse HEAD)" = "$PROBE_SOURCE"
          test -z "$(git -C workload status --porcelain)"
          for file in column_vector_graph_rabitq_quantized_asset_test.go rabitq_allocation_diagnostic_test.go; do
            cp "probe-source/TreeDB/collections/$file" "workload/TreeDB/collections/$file"
          done
          test "$(git -C workload rev-parse HEAD:TreeDB/collections/column_vector_graph_rabitq_quantized_asset_test.go)" = 9a5448774b8232e0210da158994bfd7e6045e6d1
          test "$(git -C workload hash-object TreeDB/collections/column_vector_graph_rabitq_quantized_asset_test.go)" = 3297f4dc336d3c7d2c99a18458cadfea06376375
          test "$(git -C workload hash-object TreeDB/collections/rabitq_allocation_diagnostic_test.go)" = 75b7b72fe26e4d4a013879b80845662589d8d099
          if git -C workload cat-file -e HEAD:TreeDB/collections/rabitq_allocation_diagnostic_test.go 2>/dev/null; then
            echo "Unexpected preexisting helper in original source" >&2
            exit 1
          fi
          {
            echo "original_fixture_blob=9a5448774b8232e0210da158994bfd7e6045e6d1"
            echo "probe_fixture_blob=3297f4dc336d3c7d2c99a18458cadfea06376375"
            echo "probe_helper_blob=75b7b72fe26e4d4a013879b80845662589d8d099"
            echo "original_helper=absent"
          } > "$out/source-blobs.txt"
          git -C workload add -N TreeDB/collections/rabitq_allocation_diagnostic_test.go
          git -C workload diff --binary --full-index -- TreeDB/collections/column_vector_graph_rabitq_quantized_asset_test.go TreeDB/collections/rabitq_allocation_diagnostic_test.go > "$out/probe.patch"
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" "$out/probe.patch" | sha256sum -c -
          git -C workload diff --name-only > "$out/actual-paths.txt"
          printf '%s\n' TreeDB/collections/column_vector_graph_rabitq_quantized_asset_test.go TreeDB/collections/rabitq_allocation_diagnostic_test.go > "$out/allowed-paths.txt"
          diff -u "$out/allowed-paths.txt" "$out/actual-paths.txt"
          git -C workload diff --check
          {
            echo "DIAGNOSTIC ONLY; original CI RED remains unresolved"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "workflow_sha=$GITHUB_WORKFLOW_SHA"
            echo "original_merge=$ORIGINAL_MERGE"
            echo "probe_source=$PROBE_SOURCE"
            echo "patch_sha256=$EXPECTED_PATCH_SHA256"
            echo "runner_os=$RUNNER_OS runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-unavailable} image_version=${ImageVersion:-unavailable}"
            echo "GOMAXPROCS=$GOMAXPROCS GOMEMLIMIT=$GOMEMLIMIT"
            echo "Original image=ubuntu-24.04/20261025.353.1; actual image may differ."
            echo "Focused parent/child omits original full-shard load and ordering."
            echo "Sampling=1, fixed profile buffers+2MiB stacks, two GCs per boundary; delayed and runtime allocation records remain."
            go version
            uname -a
            cat /etc/os-release
            lscpu
            git -C workload status --porcelain
            git -C workload hash-object TreeDB/collections/column_vector_graph_rabitq_quantized_asset_test.go TreeDB/collections/rabitq_allocation_diagnostic_test.go
          } > "$out/provenance.txt"
          go env -json > "$out/go-env.json"

      - name: Build exact diagnostic test binary
        shell: bash
        working-directory: workload
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rabitq-evidence"
          go test -c -o "$out/collections.test" ./TreeDB/collections > "$out/build.log" 2>&1
          sha256sum "$out/collections.test" > "$out/binary.sha256"
          go version -m "$out/collections.test" > "$out/binary-buildinfo.txt"

      - name: Run focused original parent and isolated child once
        shell: bash
        working-directory: workload
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rabitq-evidence"
          test -z "${TREEDB_COLLECTIONS_VECTOR_ALLOCATION_GATE:-}"
          set +e
          "$out/collections.test" -test.run='^TestCollectionSearchVectorIndexWithBufferRabitQQuantized2452$' -test.count=1 -test.v -test.timeout=90s > "$out/test.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$out/exit-status.txt"
          cat "$out/test.log"
          exit "$status"

      - name: Seal retained diagnostic evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rabitq-evidence"
          mkdir -p "$out"
          if test -d workload/.git; then
            git -C workload status --porcelain > "$out/final-worktree-status.txt"
          fi
          python3 - "$out" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          records = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS':
                  h = hashlib.sha256()
                  with path.open('rb') as f:
                      for block in iter(lambda: f.read(1 << 20), b''):
                          h.update(block)
                  records.append(f'{h.hexdigest()}  {path.relative_to(root)}\n')
          (root / 'SHA256SUMS').write_text(''.join(records))
          PY

      - name: Upload evidence regardless of diagnostic result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rabitq-DIAGNOSTIC-ONLY-${{ github.run_id }}
          path: ${{ runner.temp }}/rabitq-evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
