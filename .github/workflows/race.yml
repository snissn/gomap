name: "Race (manual)"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  race:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true
          cache-dependency-path: |
            go.sum

      - name: HashDB (race)
        run: go test -race ./HashDB/...

      - name: TreeDB (race, focused)
        run: go test -race ./TreeDB/db ./TreeDB/caching ./TreeDB/internal/merging
