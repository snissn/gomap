name: Standalone Mongo profile prototype (bounded diagnostic)

on:
  push:
    branches: [codex/mongo-profile-hosted-20261031]

permissions:
  contents: read

jobs:
  constructor:
    # Draft input assets require push access; no write API is used.
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/mongo-profile-hosted-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact constructor checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
          persist-credentials: false

      - name: Verify hosted filesystem before toolchain setup
        run: python3 -B experiments/mongo_profile_hosted/run.py --preflight

      - name: Fetch authenticated exact accepted client inputs
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_CLIENT_ASSET_ID: "694916289"
          PROFILE_CLIENT_BUILD_ASSET_ID: "694917396"
        run: python3 -B experiments/mongo_profile_hosted/fetch_client.py

      - name: Prepare bounded hosted syscall injector
        timeout-minutes: 7
        run: python3 -B experiments/mongo_profile_hosted/prepare_tools.py

      - name: Select exact Go toolchain source
        timeout-minutes: 5
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: false

      - name: Stage owned toolchain and execute required producer qualification
        run: python3 -B experiments/mongo_profile_hosted/run.py

      - name: Upload all constructor success and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mongo-profile-prototype-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROFILE_ROOT }}/evidence
            ${{ runner.temp }}/mongo-profile-preflight-*.json
            !${{ env.PROFILE_ROOT }}/evidence/campaign-*/treedb_mongo/db/**
            !${{ env.PROFILE_ROOT }}/evidence/campaign-*/treedb_mongo/fixture-db/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
