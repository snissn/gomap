name: "TreeDB: index-vacuum M0 evidence"

on:
  pull_request:
    paths:
      - "TreeDB/db/vacuum*.go"
      - "TreeDB/db/recoverable_root_set.go"
      - "TreeDB/db/durable_root*.go"
      - "TreeDB/db/root_publication*.go"
      - "TreeDB/internal/rootpublication/**"
      - "TreeDB/db/ordered_root_publish.go"
      - "TreeDB/db/stable_resource.go"
      - "TreeDB/db/db.go"
      - "TreeDB/public.go"
      - "scripts/treedb_vacuum_m0_capture.sh"
      - "scripts/treedb_vacuum_m0_baseline.py"
      - "scripts/treedb_vacuum_m0_paired_test.py"
      - "scripts/treedb_vacuum_m0_ci.sh"
      - "scripts/treedb_vacuum_m0_ci.py"
      - "scripts/treedb_vacuum_m0_ci_test.py"
      - "scripts/treedb_vacuum_m0_summarize.py"
      - "scripts/treedb_vacuum_m0_summarize_test.py"
      - "scripts/treedb_vacuum_m0_environment.py"
      - "scripts/treedb_vacuum_m0_environment_test.py"
      - "scripts/treedb_vacuum_m0_release.py"
      - "scripts/treedb_vacuum_m0_release_test.py"
      - ".github/workflows/treedb-vacuum-m0.yml"
  workflow_dispatch:

concurrency:
  group: treedb-vacuum-m0-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: stable production/public capture
    # Same administrator-selected PR as raw; distinct label prevents job theft.
    # Drain older raw/M0 runs before arming; register one job label at a time.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TREEDB_PERF_RUNNER_LABEL != '' && vars.TREEDB_PERF_RUNNER_PR != '' && vars.TREEDB_PERF_RUNNER_PR == format('{0}', github.event.pull_request.number) && format('{0}-m0', vars.TREEDB_PERF_RUNNER_LABEL) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    # Administrator values apply only to the existing same-repository PR route.
    # The runner must be provisioned under a host flock for its entire one-job
    # listener lifetime, including upload. Actions concurrency is not that lease.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      M0_CONTROLLED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TREEDB_PERF_RUNNER_LABEL != '' && vars.TREEDB_PERF_RUNNER_PR != '' && vars.TREEDB_PERF_RUNNER_PR == format('{0}', github.event.pull_request.number) && vars.TREEDB_M0_CONTROLLED_ADMISSION_SHA == github.event.pull_request.head.sha && '1' || '0' }}
      CPU_SET: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TREEDB_PERF_RUNNER_LABEL != '' && vars.TREEDB_PERF_RUNNER_PR != '' && vars.TREEDB_PERF_RUNNER_PR == format('{0}', github.event.pull_request.number) && vars.TREEDB_M0_CPU_SET || '' }}
      GOMAXPROCS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TREEDB_PERF_RUNNER_LABEL != '' && vars.TREEDB_PERF_RUNNER_PR != '' && vars.TREEDB_PERF_RUNNER_PR == format('{0}', github.event.pull_request.number) && vars.TREEDB_M0_GOMAXPROCS || '' }}
      M0_LEASE_PATH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TREEDB_PERF_RUNNER_LABEL != '' && vars.TREEDB_PERF_RUNNER_PR != '' && vars.TREEDB_PERF_RUNNER_PR == format('{0}', github.event.pull_request.number) && vars.TREEDB_M0_LEASE_PATH || '' }}
      M0_BASELINE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TREEDB_PERF_RUNNER_LABEL != '' && vars.TREEDB_PERF_RUNNER_PR != '' && vars.TREEDB_PERF_RUNNER_PR == format('{0}', github.event.pull_request.number) && vars.TREEDB_M0_BASELINE_SHA || '' }}
    steps:
      - name: Checkout exact head
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate environment receipt contracts
        run: |
          python3 scripts/treedb_vacuum_m0_environment_test.py
          python3 scripts/treedb_vacuum_m0_release_test.py
          python3 scripts/treedb_vacuum_m0_paired_test.py

      - name: Capture and enforce declared M0 qualification
        # Routing is independent of explicit administrator controlled admission.
        env:
          M0_QUALIFICATION_PROFILE: ${{ env.M0_CONTROLLED == '1' && 'controlled-performance' || 'hosted-semantic' }}
        run: RUN_DIR="$RUNNER_TEMP/treedb-vacuum-m0" scripts/treedb_vacuum_m0_ci.sh

      - name: Upload complete evidence packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treedb-vacuum-m0-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/treedb-vacuum-m0
          if-no-files-found: error
          overwrite: false

      - name: Observe controlled custody after artifact upload
        if: always() && steps.checkout.outcome == 'success' && env.M0_CONTROLLED == '1'
        run: |
          status=0
          M0_SOURCE_SHA="$(git rev-parse HEAD)" python3 scripts/treedb_vacuum_m0_environment.py --run-dir "$RUNNER_TEMP/treedb-vacuum-m0" --phase post-upload || status=$?
          cat "$RUNNER_TEMP/treedb-vacuum-m0/environment-post-upload.json"
          exit "$status"

      - name: Upload post-upload custody observation
        if: always() && steps.checkout.outcome == 'success' && env.M0_CONTROLLED == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treedb-vacuum-m0-custody-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/treedb-vacuum-m0/environment-post-upload.json
          if-no-files-found: error
          overwrite: false
