name: "TreeDB: index-vacuum M0 evidence"

on:
  pull_request:
    paths:
      - "TreeDB/db/vacuum_collection_bench_test.go"
      - "TreeDB/db/vacuum_collection_external_bench_test.go"
      - "TreeDB/db/vacuum_collection_latency_external_bench_test.go"
      - "TreeDB/db/vacuum_m0_fixture_test.go"
      - "scripts/treedb_vacuum_m0_capture.sh"
      - "scripts/treedb_vacuum_m0_summarize.py"
      - "scripts/treedb_vacuum_m0_summarize_test.py"
      - ".github/workflows/treedb-vacuum-m0.yml"
  workflow_dispatch:

concurrency:
  group: treedb-vacuum-m0-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: stable legacy/public capture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Capture and enforce M0 evidence
        run: RUN_DIR="$RUNNER_TEMP/treedb-vacuum-m0" scripts/treedb_vacuum_m0_capture.sh

      - name: Upload complete evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treedb-vacuum-m0-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/treedb-vacuum-m0
          if-no-files-found: error
