name: "Owner-local metadata qualification"

on:
  pull_request:
    paths:
      - 'TreeDB/collections/vector_partition_owner*'
      - 'TreeDB/collections/vector_partition_source_import_v2*'
      - 'TreeDB/collections/vector_partition_source_reader_v2*'
      - 'TreeDB/collections/column_source_directory*v2*'
      - 'TreeDB/collections/column_asset_gc.go'
      - 'TreeDB/collections/column_asset_reachability.go'
      - 'TreeDB/collections/column_store.go'
      - 'TreeDB/collections/column_publish_plan.go'
      - 'TreeDB/collections/stable_resource.go'
      - 'TreeDB/collections/column_physical_scan.go'
      - 'TreeDB/collections/column_physical_visibility.go'
      - 'TreeDB/collections/typed_column_publication.go'
      - 'TreeDB/collections/source_atomic.go'
      - 'TreeDB/collections/column_publish_write.go'
      - 'TreeDB/collections/command_wal.go'
      - 'TreeDB/internal/commitlog/command_source_import_v2*'
      - 'TreeDB/internal/commitlog/command_frame.go'
      - 'TreeDB/docs/command_wal_matrix_test.go'
      - 'TreeDB/docs/spec/command-wal-support-matrix.json'
      - 'TreeDB/collections/vector_partition_paged_root_v2*'
      - 'TreeDB/collections/vector_partition_legacy_compat_v2_test.go'
      - 'TreeDB/collections/vector_partition_manifest.go'
      - 'TreeDB/collections/vector_partition_lifecycle*'
      - 'TreeDB/collections/vector_partition_persistent_searcher_v1.go'
      - 'TreeDB/collections/vector_partition_router_v1.go'
      - 'TreeDB/internal/raftplacement/source_shard_v2*'
      - 'TreeDB/internal/vectorpartition/source_snapshot*_v2*'
      - 'TreeDB/internal/sourcepartition/*.go'
      - 'TreeDB/nativewire/vector_partition_owner*'
      - 'TreeDB/nativewire/vector_partition_generation_source_v1.go'
      - 'TreeDB/nativewire/vector_partition_production_node_v1.go'
      - '.github/workflows/owner-local-metadata-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-local-metadata-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: "off"
      GOMAXPROCS: "2"
      GOMEMLIMIT: "4GiB"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact source and formatting
        id: formatting
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          go version
          mapfile -t files < <(git diff --name-only --diff-filter=AM 0d10c1605f8887f9a1cd7e3cb910014a5b23cfe3 HEAD -- 'TreeDB/collections/*.go' 'TreeDB/nativewire/*.go' 'TreeDB/internal/raftplacement/*.go' 'TreeDB/internal/vectorpartition/*.go' 'TreeDB/internal/sourcepartition/*.go' 'TreeDB/internal/commitlog/*.go' 'TreeDB/docs/*.go')
          gofmt -d "${files[@]}" || true
          if [[ -n "$(gofmt -l "${files[@]}")" ]]; then
            for file in "${files[@]}"; do
              if [[ -n "$(gofmt -l "$file")" ]]; then
                echo "FORMATTED_FILE=$file"
                gofmt "$file" | base64 -w0
                echo
              fi
            done
            exit 1
          fi
      - name: Owner plan and public generation-source conformance
        shell: bash
        run: |
          set -euo pipefail
          go test ./TreeDB/collections ./TreeDB/internal/commitlog ./TreeDB/internal/raftplacement ./TreeDB/internal/sourcepartition ./TreeDB/internal/vectorpartition ./TreeDB/nativewire -run 'Test(VectorPartitionSourceImport|CollectionSourceImport|TypedSource|TypedMinimaInsertAndReplay|VectorPartitionOwnerSearchOpenPlan|OwnerGenerationSource|SourceShardMap|SourceSnapshot|VectorPartitionPagedRoot|VectorPartitionManifestV1|VectorPartitionManifestContextDigest)' -count=3 -timeout=10m -v | tee owner-local-tests.txt
      - name: Exact baseline schema-6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          p2_base_dir="$RUNNER_TEMP/p2-schema6-base"
          git worktree add --detach "$p2_base_dir" 0d10c1605f8887f9a1cd7e3cb910014a5b23cfe3
          cp TreeDB/collections/vector_partition_legacy_compat_v2_test.go "$p2_base_dir/TreeDB/collections/"
          go test ./TreeDB/collections -run '^TestVectorPartitionLegacyByteCompatibilityProbeV2$' -count=1 -v | tee owner-local-schema6-head.txt
          go -C "$p2_base_dir" test ./TreeDB/collections -run '^TestVectorPartitionLegacyByteCompatibilityProbeV2$' -count=1 -v | tee owner-local-schema6-base.txt
          p2_head_digest="$(sed -n '/^VPM_SCHEMA6_COMPAT=/p' owner-local-schema6-head.txt)"
          p2_base_digest="$(sed -n '/^VPM_SCHEMA6_COMPAT=/p' owner-local-schema6-base.txt)"
          [[ -n "$p2_base_digest" && "$p2_head_digest" == "$p2_base_digest" ]]
          git worktree remove --force "$p2_base_dir"
      - name: Command-WAL support matrix
        shell: bash
        run: |
          set -euo pipefail
          go test ./TreeDB/docs -run '^TestCommandWALSupportMatrix' -count=1 -timeout=2m -v | tee owner-local-command-matrix.txt
      - name: Constructor allocation comparison
        shell: bash
        run: |
          set -euo pipefail
          go test ./TreeDB/collections ./TreeDB/internal/commitlog ./TreeDB/internal/raftplacement ./TreeDB/internal/sourcepartition ./TreeDB/internal/vectorpartition -run '^$' -bench '^Benchmark(VectorPartitionOwnerSearchOpenPlan|SourceShardMapResolveDocumentID|SourceSnapshotChunkVerification|SourceSnapshotChunkDecode)V2$' -benchmem -benchtime=200ms -count=3 | tee owner-local-bench.txt
      - name: Public source import allocation and dependency growth
        shell: bash
        run: |
          set -euo pipefail
          go test ./TreeDB/collections -run '^$' -bench '^BenchmarkVectorPartitionSourceImportDirectoryV2$' -benchmem -benchtime=20x -count=3 | tee owner-local-import-bench.txt
      - name: Owner plan and source race conformance
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./TreeDB/collections ./TreeDB/internal/commitlog ./TreeDB/internal/raftplacement ./TreeDB/internal/sourcepartition ./TreeDB/internal/vectorpartition ./TreeDB/nativewire -run 'Test(VectorPartitionSourceImport|CollectionSourceImport|TypedSource|TypedMinimaInsertAndReplay|VectorPartitionOwnerSearchOpenPlan|OwnerGenerationSource|SourceShardMap|SourceSnapshot|VectorPartitionPagedRoot|VectorPartitionManifestContextDigest)' -count=1 -timeout=10m -v | tee owner-local-race.txt
      - name: Retain verified development inputs
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          p2_bundle_dir="$RUNNER_TEMP/p2-development-inputs"
          mkdir -p "$p2_bundle_dir"
          go version | tee "$p2_bundle_dir/provenance.txt"
          git rev-parse HEAD | tee -a "$p2_bundle_dir/provenance.txt"
          go env GOOS GOARCH | tee -a "$p2_bundle_dir/provenance.txt"
          go mod download
          go mod verify | tee -a "$p2_bundle_dir/provenance.txt"
          p2_toolchain_dir="$(go env GOROOT)"
          p2_module_dir="$(go env GOMODCACHE)"
          # Archive only public, verified development inputs. No .git, home,
          # Actions environment, credentials, or runtime database is included.
          cp "$p2_toolchain_dir/bin/gofmt" "$p2_bundle_dir/gofmt"
          tar -czf "$p2_bundle_dir/go-toolchain.tar.gz" -C "$p2_toolchain_dir" .
          tar -czf "$p2_bundle_dir/go-modules.tar.gz" -C "$p2_module_dir" .
          git archive --format=tar.gz -o "$p2_bundle_dir/source.tar.gz" HEAD
          cd "$p2_bundle_dir"
          p2_bundle_bytes="$(du -sb . | cut -f1)"
          [[ "$p2_bundle_bytes" -le 2147483648 ]]
          sha256sum gofmt go-toolchain.tar.gz go-modules.tar.gz source.tar.gz | tee SHA256SUMS
      - name: Upload verified development inputs
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: p2-development-inputs-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p2-development-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-local-metadata-${{ github.event.pull_request.head.sha || github.sha }}
          path: owner-local-*.txt
          if-no-files-found: ignore
      - name: Require formatting
        if: ${{ always() && steps.formatting.outcome == 'failure' }}
        run: exit 1
