name: "unified_bench: vet+test"

on:
  push:
    branches: [main]
    tags: ['**']
  workflow_dispatch:
  pull_request:

# Only consecutive runs of one ordinary PR coalesce. Main, tags and dispatch
# have unique groups: even cancel-in-progress:false can evict a pending run.
concurrency:
  group: unified-bench-tests-${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[ci retain]') && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[ci retain]') }}

permissions:
  contents: read

jobs:
  macos-scope:
    name: macOS PR scope (unified)
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[ci retain]') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 2
          sparse-checkout: /.github/scripts/ci_macos_scope.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: route
        name: Resolve scope using the immutable base policy
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE: ${{ github.sha }}
        run: |
          set -eu
          mode=full
          policy="$RUNNER_TEMP/base-macos-scope.py"
          if [[ "$(git rev-parse HEAD)" == "$MERGE" && "$(git show -s --format=%P HEAD)" == "$BASE $HEAD_SHA" ]] &&
              git show "$BASE:.github/scripts/ci_macos_scope.py" > "$policy" &&
              decision="$(python3 -I "$policy" --base "$BASE" --head "$MERGE" --lane unified)"; then
            if [[ "$decision" == skip ]]; then mode=skip; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [[ "$mode" == skip ]]; then
            echo "macOS unified: **skipped**. The accepted base policy recognized every changed path as outside this native lane."
          else
            echo "macOS unified: **full**. No positive exemption from the accepted base policy."
          fi >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    timeout-minutes: 15
    steps: &unified_checks
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/unified-bench-tests.yml

      - name: Vet
        working-directory: cmd/unified_bench
        run: go vet ./...

      - name: Test
        working-directory: cmd/unified_bench
        run: go test ./...

      - name: Record focused Linux qualification inputs
        if: runner.os == 'Linux'
        env:
          GOMAXPROCS: "2"
          GOMEMLIMIT: 4GiB
          GOWORK: "off"
        run: |
          mkdir -p artifacts/steady-rusage
          git rev-parse HEAD 'HEAD^{tree}' > artifacts/steady-rusage/source.txt
          go version > artifacts/steady-rusage/go-version.txt
          go env -json GOVERSION GOFLAGS GOEXPERIMENT GOOS GOARCH CGO_ENABLED CC CXX GOTOOLCHAIN GOWORK > artifacts/steady-rusage/go-env.json
          test "$(go env GOVERSION)" = go1.26.10

      - name: Focused steady-rusage controls normal (Linux)
        if: runner.os == 'Linux'
        env:
          GOMAXPROCS: "2"
          GOMEMLIMIT: 4GiB
          GOWORK: "off"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          unset GOMAP_DIAGNOSTIC_STEADY_RUSAGE
          set +e
          go test -json -count=1 -p 1 -timeout 3m \
            -run '^(TestRunBenchmarkProcessUsageDefaultZero|TestRunBenchmarkProcessUsageTwoReadsCheckpointOrder|TestRunBenchmarkProcessUsageOriginalFailureWins|TestRunBenchmarkProcessUsageReaderError|TestProcessUsageTimevalBounds|TestProcessUsageSelectionRefusal|TestProcessUsageCounterRegression|TestProcessUsageIncompleteAndReadLimit|TestProcessUsageSampleRegressionFailsClosed|TestRunBenchmarkProcessUsageCloseFailureIsNotLifecycleSuccess|TestRunBenchmarkBatchWriteSteadyCPUProfileMatchesTimedSpan|TestRunBenchmarkProcessUsageCleanup|TestProcessUsageCleanupRemoveFailure|TestRunBenchmarkProcessUsageCollisionBeforeOpen|TestProcessUsageOutputCollision|TestProcessUsageOutputAlias|TestProcessUsageOutputPathAliases)$' \
            ./cmd/unified_bench > artifacts/steady-rusage/normal.jsonl 2> artifacts/steady-rusage/normal.stderr
          go_exit=$?
          set -e
          printf '%s\n' "$go_exit" > artifacts/steady-rusage/normal.exit
          python3 -B .github/scripts/check_steady_rusage_events.py normal > artifacts/steady-rusage/normal.receipt.json

      - name: Focused steady-rusage controls race (Linux)
        if: runner.os == 'Linux'
        env:
          GOMAXPROCS: "2"
          GOMEMLIMIT: 4GiB
          GOWORK: "off"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          unset GOMAP_DIAGNOSTIC_STEADY_RUSAGE
          set +e
          go test -json -race -count=1 -p 1 -timeout 10m \
            -run '^(TestRunBenchmarkProcessUsageDefaultZero|TestRunBenchmarkProcessUsageTwoReadsCheckpointOrder|TestRunBenchmarkProcessUsageOriginalFailureWins|TestRunBenchmarkProcessUsageReaderError|TestProcessUsageTimevalBounds|TestProcessUsageSelectionRefusal|TestProcessUsageCounterRegression|TestProcessUsageIncompleteAndReadLimit|TestProcessUsageSampleRegressionFailsClosed|TestRunBenchmarkProcessUsageCloseFailureIsNotLifecycleSuccess|TestRunBenchmarkBatchWriteSteadyCPUProfileMatchesTimedSpan|TestRunBenchmarkProcessUsageCleanup|TestProcessUsageCleanupRemoveFailure|TestRunBenchmarkProcessUsageCollisionBeforeOpen|TestProcessUsageOutputCollision|TestProcessUsageOutputAlias|TestProcessUsageOutputPathAliases)$' \
            ./cmd/unified_bench > artifacts/steady-rusage/race.jsonl 2> artifacts/steady-rusage/race.stderr
          go_exit=$?
          set -e
          printf '%s\n' "$go_exit" > artifacts/steady-rusage/race.exit
          python3 -B .github/scripts/check_steady_rusage_events.py race > artifacts/steady-rusage/race.receipt.json

      - name: Retain focused Linux raw events and literal exits
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: steady-rusage-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/steady-rusage
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macos-latest
    needs: macos-scope
    if: ${{ !cancelled() && (needs.macos-scope.result != 'success' || needs.macos-scope.outputs.mode != 'skip') }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps: *unified_checks
