name: "Issue 4744: pinned build context"
on:
  push:
    branches: [codex/issue-4744-build-context]
    paths: [.github/workflows/issue-4744-build-context.yml]
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc1551de10098417f11ceb49ff30c90e936e1299
          persist-credentials: false
      - name: Export exact existing draft source for continuation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cc1551de10098417f11ceb49ff30c90e936e1299
          test "$(git rev-parse HEAD^{tree})" = 727b0246d9138e72e7c67f45cfd1e0b5924e7473
          out="${RUNNER_TEMP}/issue-4755-source"
          mkdir -p "$out"
          git archive --format=tar HEAD | gzip -1 > "$out/source.tar.gz"
          git rev-parse HEAD > "$out/BASE_COMMIT"
          git ls-tree -r HEAD > "$out/SOURCE_TREE.txt"
          git cat-file commit HEAD > "$out/COMMIT_OBJECT"
          (cd "$out" && sha256sum source.tar.gz SOURCE_TREE.txt COMMIT_OBJECT > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: issue-4755-source
          path: ${{ runner.temp }}/issue-4755-source
          retention-days: 3
          compression-level: 0
