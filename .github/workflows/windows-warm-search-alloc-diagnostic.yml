name: Windows warm search allocation diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Independently reviewed exact diagnostic head
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/getversioned-windows-alloc-01' && github.actor_id == '1981537' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 4GiB
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - name: Verify dispatch binding
        shell: bash
        env:
          EXPECTED: ${{ inputs.expected_head }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ && "$EXPECTED" == "$GITHUB_SHA" && "$EXPECTED" == "$WORKFLOW_COMMIT" ]]
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Record input context and compile once
        id: build
        timeout-minutes: 20
        shell: bash
        working-directory: TreeDB
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/warm-search-alloc"
          mkdir "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/source.txt"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          go version | tee "$out/go-version.txt"
          [[ "$(go version)" == 'go version go1.26.10 windows/amd64' ]]
          go env -json GOOS GOARCH GOVERSION GOROOT CGO_ENABLED CC CXX GOFLAGS GOEXPERIMENT GOCACHE GOMODCACHE GOTMPDIR > "$out/go-env.json"
          sha256sum "$(command -v go)" > "$out/go-tool.sha256"
          if [[ "$(go env CGO_ENABLED)" == 1 ]]; then
            compiler=$(command -v "$(go env CC)")
            printf '%s\n' "$compiler" > "$out/compiler-path.txt"
            sha256sum "$compiler" > "$out/compiler.sha256"
          fi
          go test -c -mod=readonly -p=1 -o "$out/collections.test.exe" ./collections 2>&1 | tee "$out/compile.log"
          sha256sum "$out/collections.test.exe" > "$out/binary.sha256"
          "$out/collections.test.exe" '-test.list=^TestColumnVectorGraphNativeSearchWarmScratchZeroAllocsV3$' > "$out/test-list.txt"
          grep -Fx 'TestColumnVectorGraphNativeSearchWarmScratchZeroAllocsV3' "$out/test-list.txt"
      - name: Run original selected child once
        id: test
        timeout-minutes: 3
        shell: bash
        working-directory: TreeDB
        env:
          TREEDB_COLLECTIONS_VECTOR_ALLOCATION_GATE: native-search-warm-scratch
          TREEDB_WARM_SEARCH_ALLOC_PROFILE_DIR: ${{ runner.temp }}/warm-search-alloc
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/warm-search-alloc"
          "$out/collections.test.exe" '-test.run=^TestColumnVectorGraphNativeSearchWarmScratchZeroAllocsV3$' -test.count=1 -test.timeout=90s 2>&1 | tee "$out/test.log"
          pipe=("${PIPESTATUS[@]}")
          rc=${pipe[0]}
          printf '%s\n' "$rc" > "$out/test-exit.txt"
          [[ "${pipe[1]}" == 0 ]] || exit 1
          exit "$rc"
      - name: Decode complete snapshots
        id: decode
        if: always() && steps.build.outcome == 'success' && steps.test.outcome != 'skipped'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/warm-search-alloc"
          for file in before.pprof after.pprof; do
            [[ -s "$out/$file" && $(wc -c < "$out/$file") -le 33554432 ]]
          done
          sha256sum "$out/before.pprof" "$out/after.pprof" > "$out/profiles.sha256"
          go tool pprof -top -alloc_objects -base "$out/before.pprof" "$out/collections.test.exe" "$out/after.pprof" > "$out/alloc-objects.txt" 2> "$out/decode.stderr"
      - name: Check closed output sizes and record step outcomes
        id: ledger
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          DECODE_OUTCOME: ${{ steps.decode.outcome }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/warm-search-alloc"
          [[ -d "$out" ]]
          printf 'build=%s\ntest=%s\ndecode=%s\n' "$BUILD_OUTCOME" "$TEST_OUTCOME" "$DECODE_OUTCOME" > "$out/outcomes.txt"
          total=0
          for file in "$out"/*; do
            [[ -f "$file" && ! -L "$file" ]]
            [[ "$file" == *.exe || "$file" == */closed-output-sha256.txt ]] && continue
            size=$(wc -c < "$file"); (( size <= 33554432 )); total=$((total+size))
            sha256sum "$file"
          done > "$out/closed-output-sha256.txt"
          ledger_size=$(wc -c < "$out/closed-output-sha256.txt")
          (( ledger_size <= 33554432 )); total=$((total+ledger_size))
          (( total <= 134217728 ))
      - name: Retain diagnostic data only
        if: always() && steps.ledger.outcome == 'success'
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-warm-search-alloc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/warm-search-alloc/*.txt
            ${{ runner.temp }}/warm-search-alloc/*.json
            ${{ runner.temp }}/warm-search-alloc/*.log
            ${{ runner.temp }}/warm-search-alloc/*.pprof
            ${{ runner.temp }}/warm-search-alloc/*.sha256
            ${{ runner.temp }}/warm-search-alloc/*.stderr
          if-no-files-found: error
          retention-days: 14
