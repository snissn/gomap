name: GPT-5.6 issue 4052 self-apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-publish:
    if: github.head_ref == 'gpt56/issue-4052-capability-manifest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Apply exact locally validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/gpt56/issue4052-patch.part* | base64 -d | gzip -dc > /tmp/issue4052.patch
          printf '%s  %s\n' '955886df28aa13036fd6d9f460a97888969ae9395c5e0e9a58dea77371ea14ee' /tmp/issue4052.patch | sha256sum --check -
          git apply --check /tmp/issue4052.patch
          git apply /tmp/issue4052.patch
          rm -rf .github/gpt56
          rm -f .github/workflows/gpt56-dependency-cache-export.yml
          test -z "$(gofmt -l TreeDB/mongo_gateway/capability_manifest.go TreeDB/mongo_gateway/capability_manifest_test.go TreeDB/mongo_gateway/compatibility_matrix_doc_test.go TreeDB/mongo_gateway/compatibility_matrix_test.go TreeDB/mongo_gateway/server_core.go TreeDB/mongo_gateway/server_test.go cmd/mongo_gateway_bench/main.go cmd/mongo_gateway_bench/main_test.go)"
          git diff --check
      - name: Validate capability manifest implementation
        env:
          GOWORK: 'off'
          GOFLAGS: '-p=1'
          GOMAXPROCS: '2'
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test ./TreeDB/mongo_gateway -count=1
          go test ./cmd/mongo_gateway_bench -count=1
          go vet ./TreeDB/mongo_gateway ./cmd/mongo_gateway_bench
          make build-treedb
          make build-mongo-gateway
      - name: Commit and publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6 Pro'
          git config user.email '1981537+snissn@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'FILES'
.github/gpt56/issue4052-patch.part00
.github/gpt56/issue4052-patch.part01
.github/gpt56/issue4052-patch.part02
.github/gpt56/issue4052-patch.part03
.github/workflows/gpt56-dependency-cache-export.yml
TreeDB/mongo_gateway/COMPATIBILITY.md
TreeDB/mongo_gateway/README.md
TreeDB/mongo_gateway/capability_manifest.go
TreeDB/mongo_gateway/capability_manifest_test.go
TreeDB/mongo_gateway/compatibility_matrix_doc_test.go
TreeDB/mongo_gateway/compatibility_matrix_test.go
TreeDB/mongo_gateway/server_core.go
TreeDB/mongo_gateway/server_test.go
cmd/mongo_gateway_bench/main.go
cmd/mongo_gateway_bench/main_test.go
FILES
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git commit -m 'mongo: generate capability metadata from executable manifest'
          git push origin HEAD:gpt56/issue-4052-capability-manifest
