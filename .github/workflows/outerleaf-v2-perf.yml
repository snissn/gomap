name: "outerleaf-v2: perf gate"

on:
  pull_request:
    branches: [ main ]
    paths:
      - "TreeDB/**"
      - "cmd/unified_bench/**"
      - "scripts/outerleaf_v2_perf_gate.sh"
      - ".github/workflows/outerleaf-v2-perf.yml"
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  per_pr_gate:
    name: per-pr fast profile gate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Run outerleaf v2 perf gate (fast profile)
        env:
          RUNS: 5
          WARMUP_RUNS: 1
          KEYS: 500000
          PROFILES: fast
          STRICT_GATE: 1
          GATE_PROFILES: fast
          GATE_MIN_RATIO_BATCH_WRITE: 0.70
          GATE_MIN_RATIO_BATCH_WRITE_STEADY: 0.70
          # Temporary floor while v2 prefix_scan optimization work tracks in #490.
          GATE_MIN_RATIO_PREFIX_SCAN: 0.05
          # Anti-noise pacing to reduce transient CV spikes on shared CI hosts.
          SLEEP_BETWEEN_CASES_SEC: 1
          SLEEP_BETWEEN_RUNS_SEC: 1
        run: |
          ./scripts/outerleaf_v2_perf_gate.sh

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outerleaf-v2-per-pr-artifacts
          path: artifacts/perf/outerleaf_v2_gate_*/

  nightly_matrix:
    name: nightly durability matrix (informational)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Run outerleaf v2 perf matrix (fast, wal_on_fast, durable)
        env:
          RUNS: 3
          WARMUP_RUNS: 1
          KEYS: 500000
          PROFILES: fast,wal_on_fast,durable
          STRICT_GATE: 0
        run: |
          ./scripts/outerleaf_v2_perf_gate.sh

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outerleaf-v2-nightly-artifacts
          path: artifacts/perf/outerleaf_v2_gate_*/
