name: 'TreeDB: m0-combiner fixture source controls (manual only)'
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Full independently reviewed controls-only harness commit
        required: true
        type: string
      root_admission_b64:
        description: ROOT controls-only admission JSON encoded with base64; no capture authority
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/m0-combiner-controls-01' && github.actor_id == '1981537' && github.run_attempt == 1
    name: exact4934 m0-combiner fixture normal and race controls only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REVIEWED_HEAD: ${{ inputs.expected_head }}
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
      ROOT_ADMISSION_B64: ${{ inputs.root_admission_b64 }}
    steps:
      - name: Authenticate fresh controls-only dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_HEAD" =~ ^[0-9a-f]{40}$ && "$REVIEWED_HEAD" == "$GITHUB_SHA" && "$REVIEWED_HEAD" == "$WORKFLOW_COMMIT" ]]
          python3 -B - <<'PY'
          import base64,json,os,pathlib,time
          assert os.environ['GITHUB_ACTOR_ID']=='1981537' and os.environ['GITHUB_RUN_ATTEMPT']=='1'
          text=os.environ['ROOT_ADMISSION_B64'];assert len(text)<=16384
          admission=json.loads(base64.b64decode(text,validate=True));assert isinstance(admission,dict)
          expected={'schema':'m0-combiner-hosted-controls-admission-v1','status':'ADMITTED_CONTROLS_ONLY',
            'authority':'ROOT','authority_thread':'01a18e7c-8c23-7fd2-8d55-b0486d938cd3','actor_id':'1981537','expected_head':os.environ['GITHUB_SHA'],'run_attempt':'1',
            'owner_manifest_sha256':'ca51c90ae96fcb04ed5764e9acd3d79a01983d0bfe99d2107a9ee7912b5938b5',
            'owner_review_sha256':'405124015cb24de0d4efcdd583f0c45e2ef3b51521efced31cdcc9c54cd757c0',
            'allow_product_capture':False}
          assert all(admission.get(k)==v for k,v in expected.items())
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m0-combiner-controls';root.mkdir()
          (root/'dispatch-admission.json').write_text(json.dumps(admission,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('M0_COMBINER_STARTED_MONOTONIC='+str(time.monotonic())+'\n')
          PY
      - name: Checkout exact reviewed binding harness
        timeout-minutes: 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/
            !/docs/benchmarks/
            !/TreeDB/docs/evidence/
            !/TreeDB/docs/benchmarks/
      - name: Setup exact source-qualification SDK
        timeout-minutes: 2
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          check-latest: false
          cache: true
      - name: Run one fixed source and control qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          test -z "$(git status --porcelain)"
          python3 -B .github/scripts/m0_combiner_hosted_controls.py guard --root "$RUNNER_TEMP/m0-combiner-controls" > "$RUNNER_TEMP/m0-combiner-controls/entry.stdout.log" 2> "$RUNNER_TEMP/m0-combiner-controls/entry.stderr.log"
      - name: Upload raw controls, failure and candidate source identities
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0-combiner-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m0-combiner-controls/output
            ${{ runner.temp }}/m0-combiner-controls/guard
            ${{ runner.temp }}/m0-combiner-controls/*.json
            ${{ runner.temp }}/m0-combiner-controls/*.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
