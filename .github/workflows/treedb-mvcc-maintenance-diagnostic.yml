name: "TreeDB: fixed PRIMARY literal runtime identities (manual only)"
on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string
      admission_b64:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/primary-row217-metadata-01' && github.actor_id == '1981537'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REVIEWED_HEAD: ${{ inputs.expected_head }}
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
      ROOT_METADATA_ADMISSION_B64: ${{ inputs.admission_b64 }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Authenticate fixed metadata harness only
        shell: bash
        run: |
          /usr/bin/timeout --signal=TERM --kill-after=5s 60s /usr/bin/python3.12 -I -B - <<'PY'
          try:
           import base64,hashlib,json,os,pathlib,re,shutil,stat,time,urllib.request
           e=os.environ
           assert e['GITHUB_REPOSITORY']=='snissn/gomap' and e['GITHUB_ACTOR_ID']=='1981537'
           assert e['GITHUB_REF']=='refs/heads/diagnostic/primary-row217-metadata-01'
           assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and e['GITHUB_RUN_ATTEMPT']=='1'
           assert e['GITHUB_SHA']==e['REVIEWED_HEAD']==e['WORKFLOW_COMMIT']
           image=dict(ImageOS='ubuntu24',ImageVersion='20261025.353.1',RUNNER_OS='Linux',RUNNER_ARCH='X64')
           assert {k:e.get(k) for k in image}==image
           assert len(e['ROOT_METADATA_ADMISSION_B64'])<=8192
           a=json.loads(base64.b64decode(e['ROOT_METADATA_ADMISSION_B64'],validate=True))
           assert a['schema']=='root-primary-row217-metadata-only-v1' and a['status']=='ADMITTED_METADATA_ONLY'
           assert a['authority']=='ROOT' and a['authority_thread']=='01a18e7c-8c23-7fd2-8d55-b0486d938cd3'
           assert a['actor_id']=='1981537' and a['head']==e['GITHUB_SHA'] and a['allow_build'] is False
           assert a['expected_image']==image
           assert re.fullmatch('[0-9a-f]{64}',a['independent_source_review_sha256'])
           assert not any(e.get(k) for k in ('NODE_OPTIONS','NODE_PATH','NODE_V8_COVERAGE','NODE_COMPILE_CACHE','GOMAXPROCS'))
           common=pathlib.Path('/home/runner/work');parent=pathlib.Path(e['RUNNER_TEMP']).resolve(strict=True)
           assert parent==common/'_temp' and pathlib.Path(e['GITHUB_WORKSPACE']).resolve().is_relative_to(common)
           root=parent/'primary-construction-metadata';root.mkdir();harness=root/'harness';harness.mkdir()
           start=time.monotonic()
           rows={'metadata.py': {'bytes': 10594, 'sha256': '0c4be16d4d06d47b7b80236493fb2cf2e3f840a2125d408c2815b25462fa0bcd'}, 'original-runtime-inputs.json': {'bytes': 39304, 'sha256': '3845114ed8f70cfaf2c6456a3017e132ac26810647f77eb94d05f1e1c434954b'}, 'publish.py': {'bytes': 3303, 'sha256': '2971a490f855164848ea37aed83e02d5d54e80a8c64961f7dd814a9d82ae5fce'}, 'scripts/ycsb_campaign_guard.py': {'bytes': 19548, 'sha256': 'b1f5308ce5de5bf1252a77694599f4be4fdf769803b4d7300c08b4901f8d9642'}, 'scripts/ycsb_compare_validate.py': {'bytes': 49260, 'sha256': '85584d03f46e2f49be94d91b377b77e08494a846a30285bfb1300b932d57cb46'}, 'scripts/ycsb_evidence_json.py': {'bytes': 1240, 'sha256': '86989ebbfa14b8f9f3c20ebe470314a29fd28c7db2ab10734d9518e39d270ea6'}, 'scripts/ycsb_runtime_observer.py': {'bytes': 20408, 'sha256': '9ea6f525e0cf46df5301be3f903367816bdb032a3d0abb4c204bda60ee104d8f'}, 'inputs.json': {'bytes': 837, 'sha256': '4d3b44e7d5ed200c6236b49881172f8097d2919f0bbb1ccc753b5ffa51c76a79'}}
           def check(extra=0):
            total=0
            for directory,dirs,names in os.walk(common,followlinks=False):
             assert all(not (pathlib.Path(directory)/n).is_symlink() for n in dirs)
             for n in names:
              p=pathlib.Path(directory)/n
              try: item=p.lstat()
              except FileNotFoundError: continue
              assert stat.S_ISREG(item.st_mode)
              total+=item.st_size
            assert total+extra<=1073741824 and shutil.disk_usage(common).free>=10737418240
            assert time.monotonic()-start<60
            return total
           check(sum(r['bytes'] for r in rows.values())+8388608)
           class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs): raise RuntimeError('redirect refused')
           opener=urllib.request.build_opener(NoRedirect)
           for name,r in rows.items():
            p=harness/name;p.parent.mkdir(parents=True,exist_ok=True)
            digest=hashlib.sha256();received=0
            with opener.open('https://raw.githubusercontent.com/snissn/gomap/'+e['GITHUB_SHA']+'/.github/primary-input-metadata/'+name,timeout=10) as response,p.open('xb') as out:
             assert response.status==200
             while True:
              block=response.read(65536)
              if not block: break
              assert received+len(block)<=r['bytes'];check(len(block));out.write(block);received+=len(block);digest.update(block)
            assert received==r['bytes'] and digest.hexdigest()==r['sha256'];check()
           data=json.dumps(a,sort_keys=True,separators=(',',':')).encode('ascii')+b'\n';check(len(data))
           with (root/'dispatch-admission.json').open('xb') as target:target.write(data)
           print(json.dumps(dict(schema='primary-metadata-bootstrap-v1',files=len(rows),all_pins_verified=True,whole_bytes=check(),scope='first authenticated sampled step; not platform-startup quota')))
          except BaseException as error:
           print(json.dumps(dict(status='METADATA_BOOTSTRAP_FAILED',error_class=type(error).__name__)));raise SystemExit(1)
          PY
      - name: One literal-only query and complete checked publication
        shell: bash
        run: |
          set -uo pipefail
          unset GH_TOKEN GITHUB_TOKEN ROOT_METADATA_ADMISSION_B64
          root="$RUNNER_TEMP/primary-construction-metadata"
          export TMPDIR="$root/tmp" TMP="$root/tmp" TEMP="$root/tmp"
          export XDG_CACHE_HOME="$root/xdg-cache" XDG_CONFIG_HOME="$root/xdg-config"
          mkdir "$TMPDIR" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" || exit 1
          /usr/bin/python3.12 -I -B "$root/harness/scripts/ycsb_campaign_guard.py" --scripts-dir "$root/harness/scripts" --out "$root/guard" --cwd "$root" --filesystem /home/runner/work --synthetic --deadline 180 --cleanup-seconds 10 --interval .2 --rss-cap-bytes 25769803776 --free-floor-bytes 10737418240 -- /usr/bin/python3.12 -I -B "$root/harness/metadata.py"
          guard_exit=$?
          /usr/bin/timeout --signal=TERM --kill-after=5s 20s /usr/bin/python3.12 -I -B "$root/harness/publish.py" "$guard_exit"
