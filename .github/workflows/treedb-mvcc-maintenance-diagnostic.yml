name: "TreeDB: original M0 common-write data projection (manual only)"
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact independently reviewed reader commit
        required: true
        type: string
      admission_b64:
        description: ROOT fixed original-data admission bytes
        required: true
        type: string
      review_b64:
        description: Actual independent source-review bytes bound by ROOT admission
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  readback:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/m0-common-write-original-data-01' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      M0_DATA_ADMISSION_B64: ${{ inputs.admission_b64 }}
      M0_DATA_REVIEW_B64: ${{ inputs.review_b64 }}
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: ${{ runner.temp }}/four-gate-readback/tmp
      GH_CONFIG_DIR: ${{ runner.temp }}/four-gate-readback/tmp/gh-config
      XDG_CACHE_HOME: ${{ runner.temp }}/four-gate-readback/tmp/cache
      XDG_CONFIG_HOME: ${{ runner.temp }}/four-gate-readback/tmp/config
    steps:
      - name: Authenticate ROOT and immutable source before checkout/download/helper import
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64,hashlib,json,os
          assert os.environ['GITHUB_ACTOR_ID']=='1981537'
          assert os.environ['GITHUB_REF']=='refs/heads/diagnostic/m0-common-write-original-data-01'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          head=os.environ['GITHUB_SHA']
          assert head==os.environ['EXPECTED_HEAD']==os.environ['WORKFLOW_SHA']
          assert len(head)==40 and all(c in '0123456789abcdef' for c in head)
          encoded=os.environ['M0_DATA_ADMISSION_B64'];assert len(encoded)<=24000
          raw=base64.b64decode(encoded,validate=True);assert len(raw)<=16384
          admission=json.loads(raw)
          for key,value in {'authority':'ROOT','authority_thread':'01a18e7c-8c23-7fd2-8d55-b0486d938cd3',
              'actor_id':'1981537','schema':'root-m0-state-wall-projection-v1','status':'ROOT_DATA_PROJECTION_ADMITTED',
              'reader_head':head,'artifact':13390292576,
              'artifact_sha256':'8bc1f60e2762200e52724b73eb1cf06284d59c7ad1c1936e3f06a7fcb2a275cf',
              'original_output_admission_sha256':'cf53e72fa93362e98acefc42e2584b3f72700939f2d6ec3f6f0f19b66e0328ec',
              'no_recapture':True}.items():
              assert type(admission.get(key)) is type(value) and admission[key]==value,key
          encoded=os.environ['M0_DATA_REVIEW_B64'];assert len(encoded)<=24000
          review=base64.b64decode(encoded,validate=True);assert 0<len(review)<=16384
          assert hashlib.sha256(review).hexdigest()==admission['independent_review_sha256']
          # ROOT authenticates reviewed authorship/readiness before dispatch;
          # byte hash equality alone does not prove authorship.
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts/four_gate_artifact_readback.py
            .github/scripts/m0_trace_consumer.py
            .github/scripts/m0_common_write_projection.py
            .github/scripts/test_m0_common_write_projection.py
            .github/scripts/m0_common_write_entry.sh
            .github/actions/m0-common-write/action.yml
            .github/actions/m0-common-write/index.js
            .github/m0-common-write-upload/index.js
            .github/m0-common-write-upload/LICENSE
            .github/scripts/test_m0_guarded_publication.py
            scripts/ycsb_campaign_guard.py
            scripts/ycsb_compare_validate.py
            scripts/ycsb_evidence_json.py
            scripts/ycsb_runtime_observer.py
            .github/scripts/test_m0_state_projection.py
            .github/m0-common-write-inputs.json
            .github/m0-common-write-README.md
            .github/workflows/treedb-mvcc-maintenance-diagnostic.yml
          sparse-checkout-cone-mode: false
      - name: Bind imported source and run fixed pure controls
        id: controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/four-gate-readback"
          mkdir "$TMPDIR"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/four-gate-readback/source.txt"
          python3 --version > "$RUNNER_TEMP/four-gate-readback/python.txt"
          gh version > "$RUNNER_TEMP/four-gate-readback/gh.txt"
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          manifest=json.loads((root/'.github/m0-common-write-inputs.json').read_text())
          for name,row in manifest['files'].items():
              data=(root/name).read_bytes()
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256'],name
          PY
          ulimit -f 64
          timeout --signal=TERM --kill-after=5s 30s python3 -B .github/scripts/test_m0_state_projection.py > "$RUNNER_TEMP/four-gate-readback/controls.stdout.log" 2> "$RUNNER_TEMP/four-gate-readback/controls.stderr.log"
          timeout --signal=TERM --kill-after=5s 30s python3 -B .github/scripts/test_m0_common_write_projection.py > "$RUNNER_TEMP/four-gate-readback/companion-controls.stdout.log" 2> "$RUNNER_TEMP/four-gate-readback/companion-controls.stderr.log"
          timeout --signal=TERM --kill-after=5s 30s python3 -B .github/scripts/test_m0_guarded_publication.py > "$RUNNER_TEMP/four-gate-readback/publication-controls.stdout.log" 2> "$RUNNER_TEMP/four-gate-readback/publication-controls.stderr.log"
      - name: Guard original data through standard upload and checked terminal drain
        if: always()
        uses: ./.github/actions/m0-common-write
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAGER: cat
          M0_COUNTED_ROOT: /home/runner/work
          M0_CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
