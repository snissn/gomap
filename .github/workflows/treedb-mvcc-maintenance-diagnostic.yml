name: "TreeDB: fixed four-gate receipt readback (manual only)"
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  readback:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/four-gate-artifact-readback-01' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts/four_gate_artifact_readback.py
          sparse-checkout-cone-mode: false
      - name: Read original archive once and authenticate before parsing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAGER: cat
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/four-gate-readback"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/four-gate-readback/source.txt"
          python3 --version > "$RUNNER_TEMP/four-gate-readback/python.txt"
          gh version > "$RUNNER_TEMP/four-gate-readback/gh.txt"
          ulimit -f 262144
          timeout --signal=TERM --kill-after=5s 90s gh api repos/snissn/gomap/actions/artifacts/13388063743/zip > "$RUNNER_TEMP/four-gate-readback/original.zip"
          timeout --signal=TERM --kill-after=5s 30s python3 -B .github/scripts/four_gate_artifact_readback.py
      - name: Retain readback only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-gate-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/four-gate-readback/*.json
            ${{ runner.temp }}/four-gate-readback/*.txt
          if-no-files-found: error
          retention-days: 14
