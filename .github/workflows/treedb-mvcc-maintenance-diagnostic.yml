name: "TreeDB: new-arm PRIMARY controls (manual only)"

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact independently reviewed harness head
        required: true
        type: string
      admission_b64:
        description: Fresh ROOT controls-only admission; no old controls credit
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/primary-8e-b24-resolver-role-01' && github.actor_id == '1981537'
    name: fixed B8e/Cb24 normal and race controls only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REVIEWED_HEAD: ${{ inputs.expected_head }}
      ROOT_ADMISSION_B64: ${{ inputs.admission_b64 }}
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
      INPUT_MANIFEST_SHA256: 68b9cff0bec208fbb4d70a09c5fabb3d42c9b930ae53846fdb6fd6e69bf3ac86
    steps:
      - name: Authenticate fixed small harness before imports or source acquisition
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          try:
           import base64, hashlib, json, os, pathlib, shutil, stat, time, urllib.request
           E = os.environ
           assert E['GITHUB_REPOSITORY'] == 'snissn/gomap' and E['GITHUB_ACTOR_ID'] == '1981537'
           assert E['GITHUB_REF'] == 'refs/heads/diagnostic/primary-8e-b24-resolver-role-01'
           assert E['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and E['GITHUB_RUN_ATTEMPT'] == '1'
           assert E['GITHUB_SHA'] == E['REVIEWED_HEAD'] == E['WORKFLOW_COMMIT']
           assert 0 < len(E['ROOT_ADMISSION_B64']) <= 32768
           a = json.loads(base64.b64decode(E['ROOT_ADMISSION_B64'], validate=True))
           assert a['schema'] == 'primary-new-arm-controls-admission-v1' and a['authority'] == 'ROOT'
           assert a['authority_thread'] == '01a18e7c-8c23-7fd2-8d55-b0486d938cd3'
           assert a['resolver_configuration_policy'] == {'path': '.github/primary-construction/resolver-input-policy.json', 'bytes': 656, 'sha256': 'd087f191d9a1d3073bdb0b0cdc7bad11aedca7aafa03695d68bccf3b9bda0da0', 'decision_sha256': '152945251f6dce775b43111aa20711d2603d15998f9417fab93c1a1e0bddecc4'}
           assert not any(E.get(k) for k in ('NODE_OPTIONS','NODE_PATH','NODE_V8_COVERAGE','NODE_COMPILE_CACHE'))
           assert a['status'] == 'ADMITTED_NEW_ARM_CONTROLS_ONLY' and a['actor_id'] == '1981537'
           assert a['head'] == E['GITHUB_SHA'] and a['allow_capture'] is False
           assert a['owner_manifest_sha256'] == '3ca00c97842855ec1c859d08371d17f13d89aa55fc1007be26fbec648684b618'
           assert a['owner_source_review_sha256'] == 'ffd74ae5d95fd1d4647e2524b778e854f814707d1775ad46a7f585b678d498e6'
           assert a['run_attempt'] == '1' and a['prior_controls_credit'] is False
           assert a['controls'] == dict(tops=4,outcomes=8,leaves=7,modes=['normal','race'])
           assert a['arms'] == dict(B='8e1133085b4052e344a73063f28c2ab142485c73',C='b24dea5e339cf94d419346ac9b38a8c90d6d3f02')
           common=pathlib.Path('/home/runner/work')
           parent=pathlib.Path(E['RUNNER_TEMP']).resolve(strict=True)
           assert parent == common/'_temp' and pathlib.Path(E['GITHUB_WORKSPACE']).resolve().is_relative_to(common)
           root=parent/'primary-allocation-construction'
           root.mkdir()  # Exclusive: never reuse an earlier attempt.
           started=time.monotonic()
           (root/'bootstrap-start.json').write_text(json.dumps(dict(monotonic=started,accounting_root=str(common))))
           harness=root/'harness';harness.mkdir()
           rows={'.github/actions/primary-construction/action.yml': {'bytes': 444, 'sha256': '1d2d43ddeba723fbbdcefeeb752d3e651778150463a33d2770ee214006552cde'}, '.github/actions/primary-construction/index.js': {'bytes': 3088, 'sha256': '2cff50a777b3f2da8d44bb070a1f141f6cd8dcc43d4f14ef9d9275b1ecfa865d'}, '.github/primary-construction/B-source.json': {'bytes': 1037618, 'sha256': '67ca914c0ab4ff39db625b8e3ee798960e6393ab3dcc9df2d03767e067017890'}, '.github/primary-construction/C-source.json': {'bytes': 1039618, 'sha256': '2f8dde18e52f1f0c7b6bc52748eecd4224c4cd0595638921192ea02d8b27d2d8'}, '.github/primary-construction/maintained-runner.py': {'bytes': 42949, 'sha256': '6f122f8ed48343dc533de17344cfaa15d2c37b80ee6f3cac360c1c27b6b8c0ac'}, '.github/primary-construction/owner-independent-review.md': {'bytes': 2640, 'sha256': 'ffd74ae5d95fd1d4647e2524b778e854f814707d1775ad46a7f585b678d498e6'}, '.github/primary-construction/owner/B-source.json': {'bytes': 2355800, 'sha256': '4143bc61ec2f2af552a2e0e9815cf73a414bcc9aa0d74f4e5afd089176ec635b'}, '.github/primary-construction/owner/C-source.json': {'bytes': 2357338, 'sha256': 'ddc4114806b8b299908c136869d094e5f7f0c4f8fe0e8fc1e81395434e82df38'}, '.github/primary-construction/owner/README.md': {'bytes': 7364, 'sha256': 'c236661575f4441e8e7d7f9ce909c442a454a823def1b0eabc51400fe1263d62'}, '.github/primary-construction/owner/accounting-contract.json': {'bytes': 4292, 'sha256': 'af07639d190b668cea8291299ba2b7f11a5cd14e5d21419897e5a787c8f7dd68'}, '.github/primary-construction/owner/activation-map.json': {'bytes': 2750, 'sha256': '8a5dffee950b4b8eb73def16f6e808447b6b26503080e484d75e7940fa6c89fc'}, '.github/primary-construction/owner/arms/B/TreeDB/caching/db.go': {'bytes': 1432029, 'sha256': '380e2f6b1145e5ef7030e5896e4103bdd4a78dc47850ae8844ad665e13dbd6a1'}, '.github/primary-construction/owner/arms/C/TreeDB/caching/db.go': {'bytes': 1432029, 'sha256': '380e2f6b1145e5ef7030e5896e4103bdd4a78dc47850ae8844ad665e13dbd6a1'}, '.github/primary-construction/owner/authority.json': {'bytes': 542, 'sha256': '8fb0fa683b48433b15e2e63c9a37fdc5bc2eac4e160cc88aa8a58f9a2d970755'}, '.github/primary-construction/owner/closure.json': {'bytes': 735, 'sha256': '27145b3da420cfc4c1d9d05c61836ac846756d3313a32b195a6df80b897ffbbc'}, '.github/primary-construction/owner/construction-attempts.json': {'bytes': 791, 'sha256': '316e309082a5a767d8ef006ca657e9e86515f4af9b065183fc0bece3ac4fb9a1'}, '.github/primary-construction/owner/controls-inventory.json': {'bytes': 1640, 'sha256': '8bb8c2cfdd14ce50bab866817eb44bf99a2c24d737f7c9fd602a1d8b4eea2815'}, '.github/primary-construction/owner/evidence-bindings.json': {'bytes': 1440, 'sha256': 'd4567ab83fa10e27fa646c541e132f9aa8da08892440df824ef46417d204d347'}, '.github/primary-construction/owner/manifest.json': {'bytes': 5764, 'sha256': '3ca00c97842855ec1c859d08371d17f13d89aa55fc1007be26fbec648684b618'}, '.github/primary-construction/owner/overlays.json': {'bytes': 8695, 'sha256': 'bb1d93c54b61323c67fe8f650339e03a64642b3a9b8a11c202c5d4afa7323586'}, '.github/primary-construction/owner/patches/B.inverse.patch': {'bytes': 17888, 'sha256': 'cf4e542a7be9a9fea6723059c88e57c1a324669055bbd749ee6f3edc49540318'}, '.github/primary-construction/owner/patches/B.patch': {'bytes': 17888, 'sha256': 'a26f161da5b9f86c6ef712001df115f744a6851d8d0cdf100387e349cfa58a4c'}, '.github/primary-construction/owner/patches/C.inverse.patch': {'bytes': 17888, 'sha256': 'cf4e542a7be9a9fea6723059c88e57c1a324669055bbd749ee6f3edc49540318'}, '.github/primary-construction/owner/patches/C.patch': {'bytes': 17888, 'sha256': 'a26f161da5b9f86c6ef712001df115f744a6851d8d0cdf100387e349cfa58a4c'}, '.github/primary-construction/owner/preimages/B/TreeDB/caching/db.go': {'bytes': 1431850, 'sha256': 'f9740bc2e1b9ac0eb668aa7d5a0d054211133e0f710065cb7710fd0ec8dad438'}, '.github/primary-construction/owner/preimages/B/TreeDB/mvcc/primary_generation_routing_v6_test.go': {'bytes': 6288, 'sha256': '2642bedc0ed6edbea8d7a599c66642c1d2107d93f1faf03355fb8cb071c56ab9'}, '.github/primary-construction/owner/preimages/C/TreeDB/caching/db.go': {'bytes': 1431850, 'sha256': 'f9740bc2e1b9ac0eb668aa7d5a0d054211133e0f710065cb7710fd0ec8dad438'}, '.github/primary-construction/owner/preimages/C/TreeDB/mvcc/primary_generation_routing_v6_test.go': {'bytes': 6288, 'sha256': '2642bedc0ed6edbea8d7a599c66642c1d2107d93f1faf03355fb8cb071c56ab9'}, '.github/primary-construction/owner/prerequisites.json': {'bytes': 2410, 'sha256': '6bb0e0408286c5be6e760fa03478edfd08be597c3e5e7e02ab38e3640ea24b11'}, '.github/primary-construction/owner/product-B-to-C.patch': {'bytes': 161470, 'sha256': '09cb34c7379ed21feda0c6b168ffb2ca1c668c067801528d0ecf8a3b3a284d0d'}, '.github/primary-construction/owner/product-B-to-C.stat.txt': {'bytes': 1769, 'sha256': '4bb1331e35fd980878374efeae1aa39785b700d90f459f3d1f9e84617ed38c51'}, '.github/primary-construction/owner/runner-bindings.json': {'bytes': 7213, 'sha256': '644c71156e6282786103bd7f9095b79729bdf09e39e581e04df0b2069156df28'}, '.github/primary-construction/owner/shared/TreeDB/caching/primary_allocation_observer.go': {'bytes': 3133, 'sha256': 'a83048b2060445fe15f45f772ceb2cba1849ea558246bc7c52d0fd1b8b5c724b'}, '.github/primary-construction/owner/shared/TreeDB/caching/primary_allocation_observer_test.go': {'bytes': 1878, 'sha256': '23719907cd6232275ced29c33807eef346734ecc266857e47904a70b3818a4e7'}, '.github/primary-construction/owner/shared/TreeDB/mvcc/primary_allocation_observer_test.go': {'bytes': 10145, 'sha256': 'bfd44088624e069f225b8280ff0beb73add7655ff4fa114e33d07bb16332de85'}, '.github/primary-construction/owner/shared/TreeDB/mvcc/primary_generation_routing_v6_test.go': {'bytes': 6621, 'sha256': 'cb096a12dfa2d05d26324e56d632ac4ebfbcacd59476605c10c2730d49b32b27'}, '.github/primary-construction/owner/source-bindings.json': {'bytes': 8532, 'sha256': '188edd66578d399ad697be096aae1e0c872c3619f8fb2218ecea8980302cacbe'}, '.github/primary-construction/owner/source-checks.json': {'bytes': 2304, 'sha256': 'ed300db0b77125901c58e6c81e25399db3e45584dff3983816855367f11b76bf'}, '.github/primary-construction/preimages/B/TreeDB/caching/db.go': {'bytes': 1431850, 'sha256': 'f9740bc2e1b9ac0eb668aa7d5a0d054211133e0f710065cb7710fd0ec8dad438'}, '.github/primary-construction/preimages/B/TreeDB/mvcc/primary_generation_routing_v6_test.go': {'bytes': 6288, 'sha256': '2642bedc0ed6edbea8d7a599c66642c1d2107d93f1faf03355fb8cb071c56ab9'}, '.github/primary-construction/preimages/C/TreeDB/caching/db.go': {'bytes': 1431850, 'sha256': 'f9740bc2e1b9ac0eb668aa7d5a0d054211133e0f710065cb7710fd0ec8dad438'}, '.github/primary-construction/preimages/C/TreeDB/mvcc/primary_generation_routing_v6_test.go': {'bytes': 6288, 'sha256': '2642bedc0ed6edbea8d7a599c66642c1d2107d93f1faf03355fb8cb071c56ab9'}, '.github/primary-construction/readonly-runtime-inputs.json': {'bytes': 39082, 'sha256': 'd429b8211e7ca4be2b45867691d23f7c4c4f3c7caf0cbe9c5d4ceff4edc87ef5'}, '.github/primary-construction/upload-artifact/LICENSE': {'bytes': 1097, 'sha256': '3e855ffa704114a51628ef8f0bf3aeb41728adf9d9070e263bf58aa5640b0eb5'}, '.github/primary-construction/upload-artifact/index.js': {'bytes': 5051718, 'sha256': '0165b8a75330f3228f2c7a234b4ff8a107b9139c2b519147f4c8e9fe99b262d8'}, '.github/scripts/primary_allocation_construction.py': {'bytes': 42458, 'sha256': 'fe779f52ae3eab3ee33041719ec7daf6ced60f23d06296635750588b69b72a3b'}, '.github/scripts/primary_new_arm_control_events.py': {'bytes': 3304, 'sha256': 'a696e10a19a48f42d0fa6409c455cb9778f26a4d7aa1a05b36e683939e804ba5'}, 'scripts/ycsb_campaign_guard.py': {'bytes': 19548, 'sha256': 'b1f5308ce5de5bf1252a77694599f4be4fdf769803b4d7300c08b4901f8d9642'}, 'scripts/ycsb_compare_validate.py': {'bytes': 49260, 'sha256': '85584d03f46e2f49be94d91b377b77e08494a846a30285bfb1300b932d57cb46'}, 'scripts/ycsb_evidence_json.py': {'bytes': 1240, 'sha256': '86989ebbfa14b8f9f3c20ebe470314a29fd28c7db2ab10734d9518e39d270ea6'}, 'scripts/ycsb_runtime_observer.py': {'bytes': 20408, 'sha256': '9ea6f525e0cf46df5301be3f903367816bdb032a3d0abb4c204bda60ee104d8f'}, '.github/primary-construction/resolver-input-policy.json': {'bytes': 656, 'sha256': 'd087f191d9a1d3073bdb0b0cdc7bad11aedca7aafa03695d68bccf3b9bda0da0'}, '.github/primary-construction/root-input-role-decision.json': {'bytes': 1678, 'sha256': '152945251f6dce775b43111aa20711d2603d15998f9417fab93c1a1e0bddecc4'}, '.github/primary-construction-inputs.json': {'bytes': 9575, 'sha256': '68b9cff0bec208fbb4d70a09c5fabb3d42c9b930ae53846fdb6fd6e69bf3ac86'}}
           class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs): raise RuntimeError('redirect refused')
           opener=urllib.request.build_opener(NoRedirect)
           def check(extra=0):
            total=0
            for directory,dirs,names in os.walk(common,followlinks=False):
             assert all(not (pathlib.Path(directory)/n).is_symlink() for n in dirs)
             for n in names:
              p=pathlib.Path(directory)/n
              try:s=p.lstat()
              except FileNotFoundError:continue
              assert stat.S_ISREG(s.st_mode) and not p.is_symlink()
              total+=s.st_size
            assert total+extra<=1073741824 and shutil.disk_usage(common).free>=10737418240
            assert time.monotonic()-started<840
            return total
           initial=check(sum(r['bytes'] for r in rows.values()))
           for name,r in rows.items():
            assert not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts
            target=harness/name;target.parent.mkdir(parents=True,exist_ok=True)
            digest=hashlib.sha256();received=0
            request=urllib.request.Request('https://raw.githubusercontent.com/snissn/gomap/'+E['GITHUB_SHA']+'/'+name)
            with opener.open(request,timeout=min(30,840-(time.monotonic()-started))) as source, target.open('xb') as out:
             assert source.status==200
             while True:
              block=source.read(65536)
              if not block:break
              assert received+len(block)<=r['bytes'];check(len(block))
              out.write(block);received+=len(block);digest.update(block)
            assert received==r['bytes'] and digest.hexdigest()==r['sha256'];check()
           local=pathlib.Path(E['GITHUB_WORKSPACE'])/'.github/actions/primary-construction'
           local.mkdir(parents=True)  # Fresh local action snapshot, not a Git checkout.
           for name in ('action.yml','index.js'):
            data=(harness/'.github/actions/primary-construction'/name).read_bytes();check(len(data))
            with (local/name).open('xb') as target: target.write(data)
            assert hashlib.sha256((local/name).read_bytes()).hexdigest()==rows['.github/actions/primary-construction/'+name]['sha256']
           check()
           (root/'bootstrap-receipt.json').write_text(json.dumps(dict(files=len(rows),bytes=sum(r['bytes'] for r in rows.values()),initial_observed_bytes_including_preexisting=initial,final_observed_bytes=check(),all_pins_verified=True,scope='from first authenticated step; not platform startup or instantaneous quota')))
           check()
           print(json.dumps(dict(bootstrap='ALL_FIXED_INPUT_PINS_VERIFIED',files=len(rows))))
          except BaseException as error:
           print(json.dumps(dict(status="BOOTSTRAP_FAILED",error_class=type(error).__name__)))
           raise SystemExit(1)
          PY
      - name: One foreground guarded controls run and standard publication
        uses: ./.github/actions/primary-construction
        env:
          GH_TOKEN: ${{ github.token }}
