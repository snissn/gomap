name: Go tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-hashdb:
    name: go test (HashDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true
          cache-dependency-path: |
            HashDB/go.sum

      - name: Test
        working-directory: HashDB
        run: go test ./...

  test-treedb:
    name: go test (TreeDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true
          cache-dependency-path: |
            TreeDB/go.sum

      - name: Test
        working-directory: TreeDB
        run: go test ./...

  test-unified-bench:
    name: go test (cmd/unified_bench)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true
          cache-dependency-path: |
            cmd/unified_bench/go.sum

      - name: Test
        working-directory: cmd/unified_bench
        run: go test ./...
