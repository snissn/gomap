name: TreeDB PRIMARY interleaving diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    name: PRIMARY interleaving (runner ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GOWORK: "off"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go as in the enforcing runner
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check grant and sample contracts
        run: |
          python3 .github/scripts/test_mvcc_primary_cost_gate.py
          python3 .github/scripts/test_mvcc_primary_interleave_diagnostic.py

      - name: Run complete original and resident control schedules
        env:
          EXACT_HEAD: ${{ github.sha }}
          RUNNER_SLOT: ${{ matrix.shard }}
        run: |
          python3 scripts/mvcc_primary_interleave_diagnostic.py \
            --root "$GITHUB_WORKSPACE" --head "$EXACT_HEAD" --slot "$RUNNER_SLOT" \
            --output "$RUNNER_TEMP/primary-interleave"

      - name: Preserve completed and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-interleave-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/primary-interleave
            !${{ runner.temp }}/primary-interleave/**/*.test
            !${{ runner.temp }}/primary-interleave/tmp/**
          if-no-files-found: warn
          retention-days: 14
