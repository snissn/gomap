name: "HashDB: vet+test (Windows)"

on:
  push:
  workflow_dispatch:

# An old routine working-head check can yield to the next admitted head.
# A tag, default/protected branch, retained evidence or dispatch gets a unique key.
concurrency:
  group: >-
    hashdb-tests-${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.deleted == false &&
      github.event.head_commit.id != '' && github.event.repository.default_branch != '' &&
      github.ref_name != github.event.repository.default_branch && !github.ref_protected &&
      (startsWith(github.ref_name, 'fix/') || startsWith(github.ref_name, 'feature/') ||
      startsWith(github.ref_name, 'feat/') || startsWith(github.ref_name, 'docs/') ||
      startsWith(github.ref_name, 'chore/') || contains(github.event.head_commit.message, '[ci routine]')) &&
      !contains(github.event.head_commit.message, '[ci retain]') && github.ref || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.deleted == false &&
      github.event.head_commit.id != '' && github.event.repository.default_branch != '' &&
      github.ref_name != github.event.repository.default_branch && !github.ref_protected &&
      (startsWith(github.ref_name, 'fix/') || startsWith(github.ref_name, 'feature/') ||
      startsWith(github.ref_name, 'feat/') || startsWith(github.ref_name, 'docs/') ||
      startsWith(github.ref_name, 'chore/') || contains(github.event.head_commit.message, '[ci routine]')) &&
      !contains(github.event.head_commit.message, '[ci retain]') }}

permissions:
  contents: read

jobs:
  test:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Vet
        working-directory: HashDB
        run: go vet ./...

      - name: Test
        working-directory: HashDB
        run: go test ./...
