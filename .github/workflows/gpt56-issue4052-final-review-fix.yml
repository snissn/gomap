name: GPT-5.6 issue 4052 exact source export

on:
  push:
    branches:
      - gpt56/issue-4052-capability-manifest

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package exact branch source
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/gomap-issue4052-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: gomap-issue4052-source-${{ github.sha }}
          path: /tmp/gomap-issue4052-source.tgz
          if-no-files-found: error
          retention-days: 1
