name: "unified_bench: suites (gates)"

on:
  push:

permissions:
  contents: read

jobs:
  suites:
    name: suites (linux)
    runs-on: ubuntu-latest
    # Hosted runs have reached the 20-minute outer limit while bigkeys_guard
    # remained within its own 15-minute fail-closed wall cap. Keep 5 minutes
    # of orchestration headroom without changing any suite-owned guard.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Unified suite headroom contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 .github/scripts/test_unified_bench_suites_headroom.py

      - name: Build unified-bench
        run: make unified-bench

      - name: "Suite: flushthrash"
        run: ./bin/unified-bench -suite flushthrash -keys 200000 -seed 1 -progress=false

      - name: "Suite: longmix"
        run: ./bin/unified-bench -suite longmix -keys 100001 -seed 1 -progress=false

      - name: "Suite: bigkeys_guard"
        run: ./bin/unified-bench -suite bigkeys_guard -keys 1000000 -seed 1 -progress=false -max-wall 15m -max-rss-mb 4096

  profiles:
    name: profiles (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        profile: [balanced, fast, durable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Build unified-bench
        run: make unified-bench

      - name: "Smoke: ${{ matrix.profile }}"
        run: ./bin/unified-bench -dbs treedb -profile ${{ matrix.profile }} -test write_rand,read_rand -keys 20000 -seed 1 -progress=false -checkpoint-between-tests
