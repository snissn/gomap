name: Peer security and global admission qualification

on:
  pull_request:
    paths:
      - 'TreeDB/nativewire/fixed_peer*'
      - 'TreeDB/nativewire/peer_*'
      - 'TreeDB/nativewire/vector_partition_global_connection_budget_v1_test.go'
      - 'TreeDB/nativewire/vector_partition_shard_search_tcp_v1.go'
      - 'TreeDB/nativewire/server.go'
      - 'TreeDB/nativewire/listener.go'
      - '.github/workflows/peer-security-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exact source and toolchain
        run: |
          git rev-parse HEAD
          go version
      - name: Global connection and peer authorization regressions
        run: go test ./TreeDB/nativewire -run 'Test(ManyIdleEndpointsRespectGlobalConnectionBudgetV1|PeerShard|VectorPartitionShardSearchTCP|HotGroupCannotExhaustUnrelatedGroupAdmissionV1)' -count=3 -timeout=6m -v
      - name: Resource and TCP race checks
        run: go test -race ./TreeDB/nativewire -run 'Test(ManyIdleEndpointsRespectGlobalConnectionBudgetV1|PeerShard|VectorPartitionShardSearchTCP|HotGroupCannotExhaustUnrelatedGroupAdmissionV1|UnknownPeerCannotSubmitOrInstallSnapshotV1|PeerSecurity|PeerCredential)' -count=1 -timeout=6m -v
      - name: Retained serving topology guardrail
        run: go test ./cmd/treedb_vector_partition_bench -run '^TestM8ServingResourcesRetainedTopologyV1$' -count=1 -timeout=4m -v
      - name: Credential-free peer regression
        if: ${{ !cancelled() }}
        run: go test ./TreeDB/nativewire -run 'Test(UnknownPeerCannotSubmitOrInstallSnapshotV1|PeerSecurity|PeerCredential)' -count=3 -timeout=4m -v
      - name: Formatting
        if: ${{ !cancelled() }}
        run: |
          files="TreeDB/nativewire/peer_*.go TreeDB/nativewire/vector_partition_global_connection_budget_v1_test.go TreeDB/nativewire/vector_partition_shard_search_tcp_v1.go TreeDB/nativewire/fixed_peer_tcp_runtime_v1.go TreeDB/nativewire/fixed_peer_security_v1_test.go TreeDB/nativewire/fixed_peer_tcp_stream_v1.go TreeDB/nativewire/fixed_peer_sparse_catalog_v1.go TreeDB/nativewire/server.go TreeDB/nativewire/listener.go"
          gofmt -d $files || true
          bad=$(gofmt -l $files)
          if [ -n "$bad" ]; then
            for file in $bad; do
              echo "FORMATTED_FILE_START $file"
              gofmt "$file" | base64 -w0
              echo
              echo "FORMATTED_FILE_END $file"
            done
            exit 1
          fi

